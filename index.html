function renderDaily(){
  if(ui.dailyView==='pending') return renderDailyPending();
  const all = state.dailies.slice().sort((a,b)=>a.order-b.order);
  const today = todayStr();
  const pendingCount = state.pendingDailies.length;

  let html = '<div class="list-head"><h1 class="page-title">デイリー</h1><div class="list-head-actions">'+
    '<button class="chip-btn '+(ui.reorderDaily?'active':'')+'" data-action="daily:reorder-toggle">'+(ui.reorderDaily?'完了':'並び替え')+'</button>'+
    (ui.reorderDaily? '' : '<button class="fab-inline" data-action="daily:add"><svg class="icon"><use href="#i-plus"/></svg></button>')+
    '</div></div>';

  if(!ui.reorderDaily){
    html += '<button class="pending-banner" data-action="daily:viewpending"><svg class="icon"><use href="#i-box"/></svg><span>保留中のデイリー</span><span class="pending-count-badge">'+pendingCount+'件</span><svg class="icon menu-row-chevron"><use href="#i-chevron"/></svg></button>';
  }

  if(all.length===0){
    return html + emptyState('まだデイリーがありません','毎日コツコツ続けたいことを登録しよう','daily:add');
  }

  if(ui.reorderDaily){
    return html + '<div class="card-list">'+all.map(d=>dailyCard(d, today, true)).join('')+'</div>';
  }

  const dueList = all.filter(d=>isDueOn(d,today));
  const restList = all.filter(d=>!isDueOn(d,today));
  const doneCount = dueList.filter(d=>d.completedDates.includes(today)).length;

  html += '<div class="list-sub-head"><span>今日やること</span><span>'+doneCount+'/'+dueList.length+' 完了</span></div>';
  html += dueList.length===0? emptyMini('今日予定のデイリーはありません','') : '<div class="card-list">'+dueList.map(d=>dailyCard(d, today, true)).join('')+'</div>';

  if(restList.length>0){
    html += '<div class="group-header with-divider"><span class="group-title">今日はお休みのデイリー</span><span class="group-title">'+restList.length+'件</span></div>';
    html += '<div class="card-list">'+restList.map(d=>dailyCard(d, today, false)).join('')+'</div>';
  }
  return html;
}

/* ===== レンダリング: アチーブメント ===== */
function achCard(a){
  const diff = DIFF_MAP[a.difficulty];
  const tagChips = a.tagIds.map(tagChip).join('');
  let eventBadge = '', locked = false;
  if(a.eventId){
    const ev = state.events.find(e=>e.id===a.eventId);
    if(ev){
      const st = eventStatus(ev);
      if(st.phase==='ended' && !a.completed){ locked = true; eventBadge = '<span class="event-badge muted">期間終了</span>'; }
      else if(st.phase==='active'){ eventBadge = '<span class="event-badge gold">残り'+st.days+'日・'+escapeHtml(ev.title)+'</span>'; }
      else { eventBadge = '<span class="event-badge sage">'+escapeHtml(ev.title)+'まであと'+st.days+'日</span>'; }
    }
  }
  const isSub = a.mode==='subtasks';
  const target = isSub ? a.subtasks.length : a.target;
  const progress = isSub ? a.subtasks.filter(s=>s.done).length : a.progress;
  const pct = target>0? Math.round((progress/target)*100) : 0;
  let left;
  if(ui.reorderAch){
    left = '<div class="reorder-controls"><button data-action="ach:up" data-id="'+a.id+'"><svg class="icon"><use href="#i-up"/></svg></button><button data-action="ach:down" data-id="'+a.id+'"><svg class="icon"><use href="#i-down"/></svg></button></div>';
  } else if(isSub){
    left = '<div class="check-circle star '+(a.completed?'checked':'')+(justCompletedKey==='ach:'+a.id?' just-completed':'')+'">'+(a.completed?'<svg class="icon"><use href="#i-check"/></svg>':progress)+'</div>';
  } else {
    left = '<button class="check-circle star '+(a.completed?'checked':'')+(justCompletedKey==='ach:'+a.id?' just-completed':'')+'" '+((locked||a.completed)?'disabled':'')+' data-action="ach:inc" data-id="'+a.id+'">'+(a.completed?'<svg class="icon"><use href="#i-check"/></svg>':(a.target>1? a.progress : ''))+'</button>';
  }
  const noteRow = (a.completed && !ui.reorderAch) ?
    '<button class="item-note-btn '+(a.note?'has-note':'')+'" data-action="ach:note" data-id="'+a.id+'"><svg class="icon xxs"><use href="#i-edit"/></svg><span>'+(a.note? escapeHtml(a.note) : 'メモを追加')+'</span></button>' : '';
  const bodyAttr = ui.reorderAch? '' : ' data-action="ach:edit" data-id="'+a.id+'"';
  const subtaskList = (isSub && !ui.reorderAch) ? '<div class="subtask-list">'+a.subtasks.map(s=>
    '<label class="subtask-row"><input type="checkbox" '+(s.done?'checked':'')+' '+(locked?'disabled':'')+' data-action="ach:subtask" data-id="'+a.id+'" data-sub="'+s.id+'"><span>'+escapeHtml(s.title)+'</span></label>'
  ).join('')+'</div>' : '';
  return '<div class="item-card '+(a.completed?'done':'')+' '+(locked?'locked':'')+'">'+left+
    '<div class="item-body"'+bodyAttr+'>'+
      '<p class="item-title">'+escapeHtml(a.title)+'</p>'+
      '<div class="item-meta">'+tagChips+'<span class="diff-chip"><svg class="icon xxs"><use href="#i-coin"/></svg>'+diff.leaves+'</span>'+eventBadge+'</div>'+
      (target>1? '<div class="bar thin"><div class="bar-fill gold" data-bar-key="achcounter:'+a.id+'" style="width:'+pct+'%"></div></div><p class="item-progress-text">'+progress+'/'+target+'</p>' : '')+
      subtaskList+
      noteRow+
    '</div></div>';
}
function renderAch(){
  const head = '<div class="list-head"><h1 class="page-title">アチーブメント</h1><div class="list-head-actions">'+
    '<button class="chip-btn '+(ui.reorderAch?'active':'')+'" data-action="ach:reorder-toggle">'+(ui.reorderAch?'完了':'並び替え')+'</button>'+
    (ui.reorderAch? '' : '<button class="fab-inline" data-action="ach:add"><svg class="icon"><use href="#i-plus"/></svg></button>')+
    '</div></div>';

  if(ui.reorderAch){
    const todo = state.achievements.filter(a=>!a.completed).slice().sort((a,b)=>a.order-b.order);
    return head + (todo.length===0? emptyState('並び替えられるアチーブがありません','未達成のアチーブがあるとここに表示されます') :
      '<div class="card-list">'+todo.map(achCard).join('')+'</div>');
  }

  if(state.achievements.length===0){
    return head + emptyState('まだアチーブメントがありません','挑戦したい大きめの目標を登録しよう','ach:add');
  }

  const filter = ui.achTagFilter || 'all';
  let list = state.achievements.slice().sort((a,b)=>a.order-b.order);
  if(filter!=='all') list = list.filter(a=>a.tagIds.includes(filter));
  const doneListAll = list.filter(a=>a.completed).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  const todoList = list.filter(a=>!a.completed);
  const showAllDone = ui.achShowAllDone;
  const doneList = showAllDone ? doneListAll : doneListAll.slice(0,3);
  const hiddenDoneCount = doneListAll.length - doneList.length;

  const tabs = '<div class="tab-scroll">'+
    '<button class="tab-chip '+(filter==='all'?'active':'')+'" data-action="ach:tagfilter" data-id="all">すべて</button>'+
    state.tags.map(t=>'<button class="tab-chip '+(filter===t.id?'active':'')+'" data-action="ach:tagfilter" data-id="'+t.id+'">'+escapeHtml(t.name)+'</button>').join('')+
    '</div>';

  let body = tabs;
  body += '<div class="group-header"><span class="group-title">これからのアチーブ</span><span class="group-title">'+todoList.length+'件</span></div>';
  body += todoList.length===0? emptyMini('これからのアチーブはありません','もっとたくさんの"小さな達成"を集めていきましょう!') : '<div class="card-list">'+todoList.map(achCard).join('')+'</div>';
  body += '<div class="group-header with-divider"><span class="group-title">達成したアチーブ</span><span class="group-title">'+doneListAll.length+'件</span></div>';
  body += doneListAll.length===0? emptyMini('達成したアチーブはまだありません','') : '<div class="card-list">'+doneList.map(achCard).join('')+'</div>';
  if(doneListAll.length>3){
    body += hiddenDoneCount>0?
      '<button class="link-btn show-more-btn" data-action="ach:toggleshowall">すべて見る(残り'+hiddenDoneCount+'件)<svg class="icon xxs"><use href="#i-chevron"/></svg></button>' :
      '<button class="link-btn show-more-btn" data-action="ach:toggleshowall">閉じる<svg class="icon xxs" style="transform:rotate(-90deg);"><use href="#i-chevron"/></svg></button>';
  }

  return head + body;
}

/* ===== レンダリング: ショップ ===== */
function combinedHistoryEntries(){
  const entries = [];
  state.purchaseHistory.forEach(p=> entries.push({id:p.id, kind:'reward', date:p.date, time:p.time, title:p.title, sub:p.cost+'枚で交換', done:!!p.done}));
  state.mysteryHistory.forEach(m=> entries.push({id:m.id, kind:'mystery', date:m.date, time:m.time, title:m.name, sub:'気まぐれボックス', done:!!m.done}));
  entries.sort((a,b)=> (b.time||b.date).localeCompare(a.time||a.date));
  return entries;
}
function rewardCard(r){
  const afford = state.leaves >= r.cost;
  const pct = clampNum(Math.round(state.leaves / r.cost * 100), 0, 100);
  const remain = Math.max(0, r.cost - state.leaves);
  return '<div class="ticket-card" data-action="reward:edit" data-id="'+r.id+'">'+
    '<div class="ticket-main">'+
      '<p class="ticket-title">'+escapeHtml(r.title)+'</p>'+
      '<div class="bar thin"><div class="bar-fill gold" data-bar-key="reward:'+r.id+'" style="width:'+pct+'%"></div></div>'+
      '<p class="ticket-sub'+(afford?' afford':'')+'">'+(afford? '交換できるよ!' : 'あと'+remain+'コイン')+'</p>'+
    '</div>'+
    '<div class="ticket-stub">'+
      '<p class="ticket-cost"><svg class="icon xxs"><use href="#i-coin"/></svg>'+r.cost+'</p>'+
      '<button class="btn-primary sm" '+(afford?'':'disabled')+' data-action="shop:buy" data-id="'+r.id+'">交換</button>'+
    '</div>'+
  '</div>';
}

function reportDiffHtml(cur, prev, point){
  if(prev===0 && cur===0) return '<span class="report-diff flat">先月比 ±0'+(point?'pt':'%')+'</span>';
  if(prev===0) return '<span class="report-diff new">先月データなし</span>';
  const diff = point ? Math.round(cur-prev) : Math.round((cur-prev)/prev*100);
  const cls = diff>0?'up':diff<0?'down':'flat';
  return '<span class="report-diff '+cls+'">先月比 '+(diff>0?'+':'')+diff+(point?'pt':'%')+'</span>';
}

      '<button class="icon-btn" data-action="report:week-next"><svg class="icon cal-next-icon"><use href="#i-back"/></svg></button></div>';
    html += renderReportStatGrid(report, prevReport);
    html += renderReportTagBreakdown(report, weekStart);
  } else {
    const meta = monthMeta(ui.reportMonth);
    const report = computeMonthlyReport(ui.reportMonth);
    const prevReport = computeMonthlyReport(shiftMonth(ui.reportMonth, -1));
    html += '<div class="cal-nav"><button class="icon-btn" data-action="report:prev"><svg class="icon"><use href="#i-back"/></svg></button>'+

    html += renderReportStatGrid(report, prevReport);
    html += renderReportTagBreakdown(report, meta.y+'-'+meta.m);
  }
  return html;
}

function openModal(title, bodyHtml){
  const existing = document.getElementById('modalRoot');
  if(existing) existing.remove(); // 別モーダルへの直接切り替え時は即差し替え(古い方をアニメーションで消す必要はない)
  const root = document.createElement('div');
  root.id = 'modalRoot';
  root.className = 'modal-overlay';
  root.innerHTML = '<div class="modal-sheet"><div class="modal-head"><h2>'+escapeHtml(title)+'</h2>'+
    '<button data-action="modal:close" class="icon-btn"><svg class="icon"><use href="#i-close"/></svg></button></div>'+
    '<div class="modal-body">'+bodyHtml+'</div></div>';
  document.body.appendChild(root);
  root.addEventListener('click', (e)=>{ if(e.target===root) closeModal(); });
  root.addEventListener('click', handleClick);
  requestAnimationFrame(()=> root.classList.add('show'));
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  if(!root) return;
  root.classList.remove('show');
  let done = false;
  const finish = ()=>{ if(done) return; done = true; root.remove(); };
  root.addEventListener('transitionend', finish, {once:true});
  setTimeout(finish, 340); // トランジションが発火しない環境向けの保険
}

    let subtasks = [];
    if(newMode==='subtasks'){
      subtaskRows.querySelectorAll('.subtask-edit-row').forEach(row=>{

        subtasks.push({ id: existingId || uid(), title: text, done: existingSub ? existingSub.done : false });
      });
      if(subtasks.length===0) newMode = 'simple';
    }
    const target = newMode==='subtasks' ? subtasks.length : clampNum(parseInt(fd.get('target'))||1,1,999);
    const progress = newMode==='subtasks' ? subtasks.filter(s=>s.done).length : (editing?Math.min(editing.progress,target):0);
    if(editing){
      editing.title=title; editing.difficulty=difficulty; editing.tagIds=tagIds; editing.eventId=eventId||null;
      editing.mode=newMode; editing.target=target; editing.progress=progress;
      if(newMode==='subtasks') editing.subtasks=subtasks;
      editing.completed = target>0 && progress>=target;
      if(!editing.completed) editing.completedAt=null;
    } else {
      const maxOrder = state.achievements.reduce((m,a)=>Math.max(m,a.order),-1);
      state.achievements.push({id:uid(), title, difficulty, mode:newMode, target, progress, subtasks, completed:(target>0&&progress>=target), completedAt:null, tagIds, eventId:eventId||null, order:maxOrder+1, note:''});
    }
    closeModal(); render();
  });

function openFocusAddModal(){
  const now = new Date();

  const today = todayStr();
  const recentCompanions = [];
  state.focusSessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(f=>{
    if(f.companion && f.companion.trim() && !recentCompanions.includes(f.companion)) recentCompanions.push(f.companion);
  });
  const suggestions = recentCompanions.slice(0,4);
  const bodyHtml = '<form id="entityForm">'+
    '<label class="field-label">日付</label>'+
    '<input class="text-input" type="date" name="date" value="'+today+'" max="'+today+'">'+

    '<div class="freq-select">'+
      '<label class="freq-option"><input type="radio" name="inputMode" value="range" checked><span>時刻で入力</span></label>'+
      '<label class="freq-option"><input type="radio" name="inputMode" value="duration"><span>時間数で入力</span></label>'+
    '</div>'+
    '<div id="rangeFields">'+
      '<label class="field-label">開始時刻</label><input class="text-input" type="time" name="startTime" value="'+nowStr+'">'+
      '<label class="field-label">終了時刻</label><input class="text-input" type="time" name="endTime" value="'+nowStr+'">'+
    '</div>'+
    '<div id="durationFields" style="display:none;">'+
      '<label class="field-label">時間数(時間)</label><input class="text-input" type="number" step="0.25" min="0.25" max="24" name="hours" placeholder="例: 2.5">'+
    '</div>'+
    '<label class="field-label">作業のお供(任意)</label>'+
    '<input class="text-input" type="text" name="companion" id="companionInput" maxlength="60" placeholder="例: 集中用プレイリスト、コーヒー">'+
    (suggestions.length? '<div class="tab-scroll" style="margin-top:8px;">'+suggestions.map(c=>'<button type="button" class="tab-chip companion-chip" data-companion="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>').join('')+'</div>' : '')+
    '<div class="level-slider-grid">'+
      levelSliderHtml('condition','cond','体調',3)+
      levelSliderHtml('mood','mood','気分',3)+
      levelSliderHtml('concentration','conc','集中度',3)+
    '</div>'+
    '<p class="hint-text">指定した日の集中時間として記録されます</p>'+
    '<div class="modal-actions"><button type="submit" class="btn-primary">記録する</button></div></form>';
  openModal('集中時間を記録', bodyHtml);
  document.querySelectorAll('.companion-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ document.getElementById('companionInput').value = btn.dataset.companion; });
  });
  const rangeFields = document.getElementById('rangeFields');
  const durationFields = document.getElementById('durationFields');
  function updateVisibility(){
    const m = document.querySelector('input[name="inputMode"]:checked').value;
    rangeFields.style.display = m==='range' ? '' : 'none';
    durationFields.style.display = m==='duration' ? '' : 'none';
  }
  document.querySelectorAll('input[name="inputMode"]').forEach(r=> r.addEventListener('change', updateVisibility));
  updateVisibility();
  document.getElementById('entityForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const mode = fd.get('inputMode')||'range';
    const date = fd.get('date') || today;
    const companion = fd.get('companion')||'';
    const parseLevel = (v)=> (v===null||v==='')? 3 : clampNum(parseInt(v),1,5);
    const condition = parseLevel(fd.get('condition'));
    const mood = parseLevel(fd.get('mood'));
    const concentration = parseLevel(fd.get('concentration'));
    let minutes = 0;
    if(mode==='range'){
      const s = fd.get('startTime'), en = fd.get('endTime');
      if(!s || !en) return;
      const sm = timeToMinutes(s), em = timeToMinutes(en);
      minutes = em - sm; if(minutes<=0) minutes += 1440;
    } else {
      const hours = parseFloat(fd.get('hours'));
      if(!hours || hours<=0) return;
      minutes = hours*60;
    }
    addFocusSession(date, minutes, companion, condition, mood, concentration);
    queueToast('<svg class="icon"><use href="#i-clock"/></svg>+'+fmtHoursMin(Math.round(minutes))+' 集中時間を記録');
    closeModal(); render();
  });
}

function trimNotesHistory(){
  const MAX_NOTES = 50;
  const entries = [];
  Object.keys(state.goodThings).forEach(date=>{ if(state.goodThings[date]) entries.push({date, type:'good'}); });
  Object.keys(state.funThings).forEach(date=>{ if(state.funThings[date]) entries.push({date, type:'fun'}); });
  if(entries.length<=MAX_NOTES) return;
  entries.sort((a,b)=> a.date.localeCompare(b.date) || (a.type<b.type?-1:1)); // 古い順
  entries.slice(0, entries.length-MAX_NOTES).forEach(en=>{
    if(en.type==='good') delete state.goodThings[en.date];
    else delete state.funThings[en.date];
  });
}

/* ===== イベント処理 ===== */
function handleClick(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  switch(action){
    case 'nav': if(ui.tab!==id) tabJustActivated = id; ui.tab = id; ui.menuView='list'; render(); break;
    case 'daily:toggle': toggleDaily(id); break;
    case 'daily:reorder-toggle': ui.reorderDaily=!ui.reorderDaily; render(); break;
    case 'daily:up': moveItem(state.dailies, id, -1); render(); break;
    case 'daily:down': moveItem(state.dailies, id, 1); render(); break;
    case 'daily:add': openDailyModal(); break;
    case 'daily:edit': openDailyModal(id); break;
    case 'daily:note': openDailyNoteModal(id); break;
    case 'daily:viewpending': ui.dailyView='pending'; render(); break;
    case 'daily:backlist': ui.dailyView='list'; render(); break;
    case 'pending:complete': completePendingDaily(id); break;
    case 'pending:dismiss': dismissPendingDaily(id); break;
    case 'ach:reorder-toggle': ui.reorderAch=!ui.reorderAch; render(); break;
    case 'ach:up': moveItem(state.achievements.filter(a=>!a.completed), id, -1); render(); break;
    case 'ach:down': moveItem(state.achievements.filter(a=>!a.completed), id, 1); render(); break;
    case 'ach:inc': incrementAchievement(id); break;
    case 'ach:subtask': toggleSubtask(id, btn.dataset.sub); break;
    case 'ach:note': openAchievementNoteModal(id); break;
    case 'ach:tagfilter': ui.achTagFilter = id; render(); break;
    case 'ach:toggleshowall': ui.achShowAllDone = !ui.achShowAllDone; render(); break;
    case 'ach:add': openAchModal(); break;
    case 'ach:edit': openAchModal(id); break;
    case 'reward:add': openRewardModal(); break;
    case 'reward:edit': openRewardModal(id); break;
    case 'shop:buy': confirmBuy(id); break;
    case 'shop:buy-confirmed': buyReward(id); closeModal(); break;
    case 'shop:open-box': openMysteryBox(); break;
    case 'menu:goto': ui.tab='menu'; menuNavDirection='forward'; ui.menuView=id; render(); break;
    case 'menu:back': menuNavDirection='back'; ui.menuView='list'; render(); break;
    case 'cal:prev': ui.calendarMonth = shiftMonth(ui.calendarMonth||todayStr().slice(0,7), -1); render(); break;
    case 'cal:next': ui.calendarMonth = shiftMonth(ui.calendarMonth||todayStr().slice(0,7), 1); render(); break;
    case 'cal:select': ui.calendarSelectedDate = id; render(); break;
    case 'report:prev': ui.reportMonth = shiftMonth(ui.reportMonth||todayStr().slice(0,7), -1); render(); break;
    case 'report:next': ui.reportMonth = shiftMonth(ui.reportMonth||todayStr().slice(0,7), 1); render(); break;
    case 'report:range': ui.reportRange = id; render(); break;
    case 'report:week-prev': ui.reportWeekStart = shiftWeek(ui.reportWeekStart||startOfWeek(todayStr()), -1); render(); break;
    case 'report:week-next': ui.reportWeekStart = shiftWeek(ui.reportWeekStart||startOfWeek(todayStr()), 1); render(); break;
    case 'goal:add': openGoalModal(); break;
    case 'goal:edit': openGoalModal(id); break;
    case 'event:add': openEventModal(); break;
    case 'event:edit': openEventModal(id); break;
    case 'tag:add': openTagModal(); break;
    case 'tag:edit': openTagModal(id); break;
    case 'pool:add': openPoolModal(); break;
    case 'pool:edit': openPoolModal(id); break;
    case 'history:toggle': toggleHistoryDone(btn.dataset.kind, id); break;
    case 'favorite:tab': ui.favoriteCategory = id; render(); break;
    case 'favorite:addcat': openFavoriteCategoryModal(); break;
    case 'favorite:editcat': openFavoriteCategoryEditModal(id); break;
    case 'favorite:add': openFavoriteItemModal(); break;
    case 'favorite:edit': openFavoriteItemModal(id); break;
    case 'advice:tab': ui.adviceCategory = id; render(); break;
    case 'advice:addcat': openAdviceCategoryModal(); break;
    case 'advice:editcat': openAdviceCategoryEditModal(id); break;
    case 'advice:add': openAdviceNoteModal(); break;
    case 'advice:delete': if(confirm('このメモを削除しますか?')){ state.adviceNotes = state.adviceNotes.filter(n=>n.id!==id); render(); } break;
    case 'focus:delete': if(confirm('この集中時間の記録を削除しますか?')){ state.focusSessions = state.focusSessions.filter(f=>f.id!==id); render(); } break;
    case 'focus:add': openFocusAddModal(); break;
    case 'focus:editgoal': openFocusGoalModal(); break;
    case 'weeklygoal:edit': openWeeklyGoalModal(); break;
    case 'weeklygoal:clear': state.weeklyGoalText=''; state.weeklyGoalSetDate=null; closeModal(); render(); break;
    case 'todaygoal:edit': openTodayGoalModal(); break;
    case 'todaygoal:clear': state.todayGoalText=''; state.todayGoalSetDate=null; closeModal(); render(); break;
    case 'goodthing:edit': openGoodThingModal(); break;
    case 'daysat:set': {
      const lvl = Number(id);
      const t = todayStr();
      if(state.dayRatings[t]===lvl) delete state.dayRatings[t];
      else state.dayRatings[t] = lvl;
      render();
    } break;
    case 'goodthing:clear': delete state.goodThings[todayStr()]; closeModal(); render(); break;
    case 'goodthing:delete': delete state.goodThings[id]; render(); break;
    case 'funthing:edit': openFunThingModal(); break;
    case 'funthing:clear': delete state.funThings[addDays(todayStr(),1)]; closeModal(); render(); break;
    case 'funthing:delete': delete state.funThings[id]; render(); break;
    case 'pool:delete': state.mysteryPool = state.mysteryPool.filter(p=>p.id!==id); render(); break;
    case 'mystery:grant': state.mysteryBoxes++; queueToast('気まぐれボックスを追加しました'); render(); break;
    case 'data:export': exportData(); break;
    case 'data:reset': confirmReset(); break;
    case 'modal:close': closeModal(); break;
    case 'levelup:close': closeLevelUpCelebration(); break;
    case 'modal:delete': {
      const kind = btn.dataset.kind;
      if(!confirm('本当に削除しますか?')) break;
      if(kind==='daily') state.dailies = state.dailies.filter(x=>x.id!==id);
      if(kind==='ach') state.achievements = state.achievements.filter(x=>x.id!==id);
      if(kind==='reward') state.rewards = state.rewards.filter(x=>x.id!==id);
      if(kind==='goal') state.goals = state.goals.filter(x=>x.id!==id);
      if(kind==='event'){
        state.events = state.events.filter(x=>x.id!==id);
        state.achievements.forEach(a=>{ if(a.eventId===id) a.eventId=null; });
      }
      if(kind==='tag'){
        state.tags = state.tags.filter(x=>x.id!==id);
        state.dailies.forEach(d=>{ d.tagIds = d.tagIds.filter(t=>t!==id); });
        state.achievements.forEach(a=>{ a.tagIds = a.tagIds.filter(t=>t!==id); });
        if(ui.achTagFilter===id) ui.achTagFilter='all';
      }
      if(kind==='advicecat'){
        state.adviceCategories = state.adviceCategories.filter(x=>x.id!==id);
        state.adviceNotes = state.adviceNotes.filter(n=>n.categoryId!==id);
        if(ui.adviceCategory===id) ui.adviceCategory = null;
      }
      if(kind==='pool') state.mysteryPool = state.mysteryPool.filter(x=>x.id!==id);
      if(kind==='favoriteitem') state.favoriteItems = state.favoriteItems.filter(x=>x.id!==id);
      if(kind==='favoritecat'){
        state.favoriteCategories = state.favoriteCategories.filter(x=>x.id!==id);
        state.favoriteItems = state.favoriteItems.filter(f=>f.categoryId!==id);
        if(ui.favoriteCategory===id) ui.favoriteCategory = null;
      }
      closeModal(); render();
      break;
    }
  }
}

function flushToasts(){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const queue = toastQueue.slice();
  toastQueue = [];
  queue.forEach((msg, i)=>{
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className='toast';
      el.innerHTML = msg;
      root.appendChild(el);
      requestAnimationFrame(()=> el.classList.add('show'));
      setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, 2400);
    }, i*350);
  });
}

function animateBars(){
  const entries = [];
  document.querySelectorAll('[data-bar-key]').forEach(el=>{
    const key = el.dataset.barKey;
    const target = el.style.width;
    if(!key || !target) return;
    const prev = barPrevValues[key];
    const forceReset = justLeveledBarKeys.has(key);
    barPrevValues[key] = target; // 次回比較用に今回の値を記憶しておく
    if(prev === target && !forceReset) return; // 値が変わっていなければ動かさない
    const startWidth = (forceReset || prev===undefined) ? '0%' : prev;
    el.style.width = startWidth;
    entries.push([el, target]);
  });
  if(!entries.length) return;
  void document.body.offsetHeight; // 開始幅を一度確定させるための強制リフロー
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      entries.forEach(([el, target])=>{ el.style.width = target; });
    });
  });
}
function render(){
  saveState();
  const app = document.getElementById('app');
  app.innerHTML = ICONS + renderTopBar() + '<main class="main">'+renderTab()+'</main>' + renderNav();
  justCompletedKey = null;
  tabJustActivated = null;
  menuNavDirection = null;
  animateBars();
  justLeveledBarKeys.clear();
  flushToasts();
}

document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='importFile'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.dailies)) throw new Error('invalid');
        state = normalizeState(Object.assign(defaultState(), data), data);
        rolloverCheck();
        queueToast('インポートしました');
        render();
      }catch(err){ alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選んでください。'); }
    };
    reader.readAsText(file);
  }
});

function setupPressFeedback(){
  let pressedEl = null;
  function down(e){
    const el = e.target.closest('.btn-primary, .fab-inline');
    if(!el || el.disabled) return;
    el.classList.remove('is-releasing');
    el.classList.add('is-pressed');
    pressedEl = el;
  }
  function up(){
    const el = pressedEl;
    pressedEl = null;
    if(!el) return;
    el.classList.remove('is-pressed');
    if(el.classList.contains('fab-inline')){
      void el.offsetWidth;
      el.classList.add('is-releasing');
      setTimeout(()=>{ el.classList.remove('is-releasing'); }, 420);
    }
  }
  function cancel(){
    if(pressedEl) pressedEl.classList.remove('is-pressed');
    pressedEl = null;
  }
  document.body.addEventListener('pointerdown', down);
  document.body.addEventListener('pointerup', up);
  document.body.addEventListener('pointercancel', cancel);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  setupPressFeedback();
  render();
});
</script>
