function dailyCard(d, today, dueToday){
  const diff = DIFF_MAP[d.difficulty];
  const done = d.completedDates.includes(today);
  const monthStr = today.slice(0,7);
  const monthCount = d.completedDates.filter(x=>x.indexOf(monthStr)===0).length;
  const daysInMonth = new Date(Number(today.slice(0,4)), Number(today.slice(5,7)), 0).getDate();
  const monthPct = Math.round(monthCount/daysInMonth*100);
  const tagChips = d.tagIds.map(tagChip).join('');
  const note = (d.notes && d.notes[today]) || '';
  const schedTag = scheduleLabel(d)!=='毎日'? '<span class="diff-chip">'+scheduleLabel(d)+'</span>' : '';
  let left;
  if(ui.reorderDaily){
    left = '<div class="reorder-controls"><button class="drag-handle" data-role="drag-handle"><svg class="icon"><use href="#i-grip"/></svg></button></div>';
  } else if(!dueToday){
    left = '<div class="check-circle disabled-circle"></div>';
  } else {
    left = '<button class="check-circle '+(done?'checked':'')+(justCompletedKey==='daily:'+d.id?' just-completed':'')+'" data-action="daily:toggle" data-id="'+d.id+'">'+(done?'<svg class="icon"><use href="#i-check"/></svg>':'')+'</button>';
  }
  const noteRow = (dueToday && done && !ui.reorderDaily) ?
    '<button class="item-note-btn '+(note?'has-note':'')+'" data-action="daily:note" data-id="'+d.id+'"><svg class="icon xxs"><use href="#i-edit"/></svg><span>'+(note? escapeHtml(note) : 'メモを追加')+'</span></button>' : '';
  const bodyAttr = ui.reorderDaily? '' : ' data-action="daily:edit" data-id="'+d.id+'"';
  const dragAttrs = ui.reorderDaily? ' drag-item" data-id="'+d.id+'">' : '">';
  return '<div class="item-card '+(done?'done':'')+' '+(!dueToday?'muted-card':'')+dragAttrs+left+
    '<div class="item-body"'+bodyAttr+'>'+
      '<p class="item-title">'+escapeHtml(d.title)+'</p>'+
      '<div class="item-meta">'+tagChips+schedTag+'<span class="diff-chip"><svg class="icon xxs"><use href="#i-coin"/></svg>'+diff.leaves+'</span></div>'+
      (dueToday? '<div class="bar thin"><div class="bar-fill olive" data-bar-key="dailymonth:'+d.id+'" style="width:'+monthPct+'%"></div></div><p class="item-progress-text">今月 '+monthCount+'/'+daysInMonth+'日</p>' : '<p class="item-progress-text">今日はお休みの日です</p>')+
      noteRow+
    '</div></div>';
}

/* ===== レンダリング: アチーブメント ===== */
function achDeadlineBadge(a){
  if(!a.dueDate || a.completed) return '';
  const today = todayStr();
  if(today > a.dueDate){
    return '<span class="event-badge clay">期限切れ('+fmtMD(a.dueDate)+')</span>';
  }
  const days = daysBetween(today, a.dueDate);
  const label = days===0 ? '今日締切' : '締切まであと'+days+'日';
  return '<span class="event-badge '+(days<=3?'gold':'sage')+'">'+label+'</span>';
}
function achCard(a){
  const diff = DIFF_MAP[a.difficulty];
  const tagChips = a.tagIds.map(tagChip).join('');
  let eventBadge = '', locked = false;
  if(a.eventId){
    const ev = state.events.find(e=>e.id===a.eventId);
    if(ev){
      const st = eventStatus(ev);
      if(st.phase==='ended' && !a.completed){ locked = true; eventBadge = '<span class="event-badge muted">期間終了</span>'; }
      else if(st.phase==='active'){ eventBadge = '<span class="event-badge gold">残り'+st.days+'日・'+escapeHtml(ev.title)+'</span>'; }
      else { eventBadge = '<span class="event-badge sage">'+escapeHtml(ev.title)+'まであと'+st.days+'日</span>'; }
    }
  }
  const isSub = a.mode==='subtasks';
  const target = isSub ? a.subtasks.length : a.target;
  const progress = isSub ? a.subtasks.filter(s=>s.done).length : a.progress;
  const pct = target>0? Math.round((progress/target)*100) : 0;
  let left;
  if(ui.reorderAch){
    left = '<div class="reorder-controls"><button class="drag-handle" data-role="drag-handle"><svg class="icon"><use href="#i-grip"/></svg></button></div>';
  } else if(isSub){
    left = '<div class="check-circle star '+(a.completed?'checked':'')+(justCompletedKey==='ach:'+a.id?' just-completed':'')+'">'+(a.completed?'<svg class="icon"><use href="#i-check"/></svg>':progress)+'</div>';
  } else {
    left = '<button class="check-circle star '+(a.completed?'checked':'')+(justCompletedKey==='ach:'+a.id?' just-completed':'')+'" '+((locked||a.completed)?'disabled':'')+' data-action="ach:inc" data-id="'+a.id+'">'+(a.completed?'<svg class="icon"><use href="#i-check"/></svg>':(a.target>1? a.progress : ''))+'</button>';
  }
  const noteRow = (a.completed && !ui.reorderAch) ?
    '<button class="item-note-btn '+(a.note?'has-note':'')+'" data-action="ach:note" data-id="'+a.id+'"><svg class="icon xxs"><use href="#i-edit"/></svg><span>'+(a.note? escapeHtml(a.note) : 'メモを追加')+'</span></button>' : '';
  const bodyAttr = ui.reorderAch? '' : ' data-action="ach:edit" data-id="'+a.id+'"';
  const subtaskList = (isSub && !ui.reorderAch) ? '<div class="subtask-list">'+a.subtasks.map(s=>
    '<label class="subtask-row"><input type="checkbox" '+(s.done?'checked':'')+' '+(locked?'disabled':'')+' data-action="ach:subtask" data-id="'+a.id+'" data-sub="'+s.id+'"><span>'+escapeHtml(s.title)+'</span></label>'
  ).join('')+'</div>' : '';
  const achDragAttrs = ui.reorderAch? ' drag-item" data-id="'+a.id+'">' : '">';
  return '<div class="item-card '+(a.completed?'done':'')+' '+(locked?'locked':'')+achDragAttrs+left+
    '<div class="item-body"'+bodyAttr+'>'+
      '<p class="item-title">'+escapeHtml(a.title)+'</p>'+
      '<div class="item-meta">'+tagChips+'<span class="diff-chip"><svg class="icon xxs"><use href="#i-coin"/></svg>'+diff.leaves+'</span>'+eventBadge+achDeadlineBadge(a)+'</div>'+
      (target>1? '<div class="bar thin"><div class="bar-fill gold" data-bar-key="achcounter:'+a.id+'" style="width:'+pct+'%"></div></div><p class="item-progress-text">'+progress+'/'+target+'</p>' : '')+
      subtaskList+
      noteRow+
    '</div></div>';
}

  const filter = ui.achTagFilter || 'all';
  let list = state.achievements.slice().sort((a,b)=>a.order-b.order);
  if(filter!=='all') list = list.filter(a=>a.tagIds.includes(filter));

    if(a.dueDate && !b.dueDate) return -1;
    if(!a.dueDate && b.dueDate) return 1;
    return a.order-b.order;

  const showAllDone = ui.achShowAllDone;

    '</div>';

  let body = tabs;

  body += '<div class="group-header with-divider"><span class="group-title">達成したアチーブ</span><span class="group-title">'+doneListAll.length+'件</span></div>';
  body += doneListAll.length===0? emptyMini('達成したアチーブはまだありません','') : '<div class="card-list">'+doneList.map(achCard).join('')+'</div>';
  if(doneListAll.length>3){

function sleepRel18(t){ return (timeToMinutes(t) - 1080 + 1440) % 1440; }
function sleepRelToHM(v){ return minutesToHM(Math.round(v) + 1080); }
function sleepMean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function sleepSd(a){
  if(a.length<2) return null;
  const m = sleepMean(a);
  return Math.sqrt(sleepMean(a.map(v=>(v-m)*(v-m))));
}
function sleepHasTimes(l){ return !!(l && l.onsetTime && l.wakeTime && !isNaN(timeToMinutes(l.onsetTime)) && !isNaN(timeToMinutes(l.wakeTime))); }
function slChip(action, id, label, active){
  return '<button class="tab-chip'+(active?' active':'')+'" data-action="'+action+'" data-id="'+id+'">'+label+'</button>';
}

function computeSleepStats(dates){
  const today = todayStr();
  const past = dates.filter(d=>d<=today);
  const logs = past.map(d=>state.sleepLogs[d]).filter(sleepHasTimes);
  const beds = logs.filter(l=>l.bedTime).map(l=>sleepRel18(l.bedTime));
  const onsets = logs.map(l=>sleepRel18(l.onsetTime));
  const wakes = logs.map(l=>sleepRel18(l.wakeTime));
  const q = logs.map(l=>l.quality).filter(v=>v!=null);
  const wq = logs.map(l=>l.wakeQuality).filter(v=>v!=null);
  return {
    n: logs.length, days: past.length,
    avgSleep: sleepMean(logs.map(l=>sleepDurationMin(l.onsetTime,l.wakeTime))),
    avgBed: sleepMean(beds), nBed: beds.length,
    avgOnset: sleepMean(onsets), sdOnset: sleepSd(onsets),
    avgWake: sleepMean(wakes), sdWake: sleepSd(wakes),
    avgQ: sleepMean(q), avgWQ: sleepMean(wq)
  };
}

function sleepDiffSpan(cur, prev, kind, label){
  if(cur==null) return '';
  if(prev==null) return '<span class="report-diff new">'+label+'データなし</span>';
  const d = kind==='pt' ? Math.round((cur-prev)*10)/10 : Math.round(cur-prev);
  return '<span class="report-diff flat">'+label+' '+(d>0?'+':(d===0?'±':''))+d+(kind==='pt'?'':'分')+'</span>';
}

function sleepPeriodDates(){
  if(!ui.sleepRange) ui.sleepRange = 'week';
  if(!ui.sleepMonth) ui.sleepMonth = todayStr().slice(0,7);
  if(!ui.sleepWeekStart) ui.sleepWeekStart = startOfWeek(todayStr());
  const range = ui.sleepRange;
  let dates = [], prevDates = [], label;
  if(range==='week'){
    const ws = ui.sleepWeekStart;
    for(let i=0;i<7;i++){ dates.push(addDays(ws,i)); prevDates.push(addDays(ws,i-7)); }
    label = fmtDate(ws)+' 〜 '+fmtDate(addDays(ws,6));
  } else {
    const meta = monthMeta(ui.sleepMonth);
    const pm = shiftMonth(ui.sleepMonth,-1), pmeta = monthMeta(pm);
    const mk = (ym, day)=> ym+'-'+String(day).padStart(2,'0');
    for(let d=1; d<=meta.daysInMonth; d++) dates.push(mk(ui.sleepMonth,d));
    for(let d=1; d<=pmeta.daysInMonth; d++) prevDates.push(mk(pm,d));
    label = meta.y+'年'+meta.m+'月';
  }
  return {range, dates, prevDates, label};
}
function sleepNav(delta){
  if((ui.sleepRange||'week')==='week') ui.sleepWeekStart = shiftWeek(ui.sleepWeekStart||startOfWeek(todayStr()), delta);
  else ui.sleepMonth = shiftMonth(ui.sleepMonth||todayStr().slice(0,7), delta);
  render();
}

  const timeCell = (avg, sd, prevAvg, label)=> cell(avg==null?'—':sleepRelToHM(avg), label, sdSpan(sd)+(avg==null?'':' '+sleepDiffSpan(avg, prevAvg, 'min', cmp)));
  const q = (cur.avgQ==null?'—':(Math.round(cur.avgQ*10)/10).toFixed(1));

    cell(cur.avgSleep==null?'—':fmtHoursMin(Math.round(cur.avgSleep)), '平均睡眠時間', cur.avgSleep==null?'':sleepDiffSpan(cur.avgSleep, prev.avgSleep, 'min', cmp))+

}

function renderSleepBandChart(dates, weekly){
  const today = todayStr();
  const rows = dates.map(d=>({d, log: state.sleepLogs[d]||null}));
  let minV = 240, maxV = 960;
  rows.forEach(r=>{
    if(!sleepHasTimes(r.log)) return;
    const o = sleepRel18(r.log.onsetTime), w = sleepRel18(r.log.wakeTime);
    const b = r.log.bedTime ? sleepRel18(r.log.bedTime) : o;
    minV = Math.min(minV, b, o); maxV = Math.max(maxV, w);
  });
  const axisMin = Math.max(0, Math.floor(minV/120)*120);
  const axisMax = Math.min(1440, Math.ceil(maxV/120)*120);
  const span = axisMax - axisMin;
  const W=340, pl=56, pr=34, pw=W-pl-pr, top=22;
  const rowH = weekly?32:17, barH = weekly?15:9;
  const H = top + rows.length*rowH + 4;
  const x = m => pl + (m-axisMin)/span*pw;
  let grid = '', bg = '', body = '';
  for(let t=axisMin; t<=axisMax; t+=120){
    const xx = x(t).toFixed(1);
    grid += '<line x1="'+xx+'" x2="'+xx+'" y1="'+(top-4)+'" y2="'+(H-4)+'" style="stroke:var(--tan);stroke-width:1;opacity:.7;"/>';
    grid += '<text x="'+xx+'" y="12" text-anchor="middle" font-size="10.5" style="fill:var(--ink-soft)">'+(((t+1080)/60)%24)+'時</text>';
  }
  rows.forEach((r,i)=>{
    const y0 = top + i*rowH, cy = y0 + rowH/2;
    const dt = dateObj(r.d), dow = dt.getDay();
    if(dow===0 || dow===6) bg += '<rect x="0" y="'+y0+'" width="'+W+'" height="'+rowH+'" style="fill:var(--paper-2);opacity:.75;"/>';
    const future = r.d > today;
    body += '<text x="4" y="'+(cy+4)+'" font-size="10.5" style="fill:var(--ink-soft);'+(future?'opacity:.5;':'')+'">'+(dt.getMonth()+1)+'/'+dt.getDate()+'('+DOW_LABEL[DOW_ORDER[dow]]+')</text>';
    if(sleepHasTimes(r.log)){
      const o = sleepRel18(r.log.onsetTime), w = sleepRel18(r.log.wakeTime);
      if(r.log.bedTime){
        const b = sleepRel18(r.log.bedTime);
        if(b < o) body += '<rect x="'+x(b).toFixed(1)+'" y="'+(cy-barH/2)+'" width="'+(x(o)-x(b)).toFixed(1)+'" height="'+barH+'" rx="2" fill="#5E6C9E" opacity="0.3"/>';
      }
      if(w > o){
        body += '<rect x="'+x(o).toFixed(1)+'" y="'+(cy-barH/2)+'" width="'+(x(w)-x(o)).toFixed(1)+'" height="'+barH+'" rx="3" fill="#5E6C9E"/>';
        const dur = w - o;
        body += '<text x="'+(W-2)+'" y="'+(cy+4)+'" text-anchor="end" font-size="10.5" style="fill:var(--ink-soft)">'+Math.floor(dur/60)+':'+String(dur%60).padStart(2,'0')+'</text>';
      }
    }
    if(!future){
      body += '<rect x="0" y="'+y0+'" width="'+W+'" height="'+rowH+'" fill="transparent" style="cursor:pointer;" data-action="'+(r.log?'sleep:edit':'sleep:addon')+'" data-id="'+r.d+'"/>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="睡眠の帯グラフ">'+bg+grid+body+'</svg>';
}

function sleepPeriodLogs(period){
  const today = todayStr();
  const from = period==='all' ? '0000-00-00' : addDays(today, -(period-1));
  return Object.keys(state.sleepLogs).filter(d=>d>=from && d<=today && sleepHasTimes(state.sleepLogs[d])).sort().map(d=>({date:d, log:state.sleepLogs[d]}));
}
function sleepDayOutcomes(d){
  const ss = state.focusSessions.filter(f=>f.date===d);
  const avg = k=>{ const v = ss.map(f=>f[k]).filter(x=>typeof x==='number'); return v.length? sleepMean(v) : null; };
  const sat = state.dayRatings[d];
  return {
    focus: ss.length? ss.reduce((a,f)=>a+f.minutes,0) : null,
    concentration: avg('concentration'), condition: avg('condition'), mood: avg('mood'),
    sat: (typeof sat==='number' && sat>0)? sat : null
  };
}
function sleepAvgOf(list, fn){
  const v = list.map(fn).filter(x=>x!=null);
  return {avg: sleepMean(v), n: v.length};
}
function sleepSplitGroups(items, split){
  if(split==='duration'){
    const durs = items.map(x=>sleepDurationMin(x.log.onsetTime, x.log.wakeTime)).sort((p,q)=>p-q);
    const mid = Math.floor(durs.length/2);
    const median = durs.length % 2 ? durs[mid] : (durs[mid-1]+durs[mid])/2;
    const dur = x=>sleepDurationMin(x.log.onsetTime, x.log.wakeTime);
    return {a: items.filter(x=>dur(x)>=median), b: items.filter(x=>dur(x)<median),
      nameA:'長い日', nameB:'短い日', cut:'境目: '+fmtHoursMin(Math.round(median))+'(期間内の中央値)'};
  }
  const has = x=>x.log[split]!=null;
  return {a: items.filter(x=>has(x) && x.log[split]>=4), b: items.filter(x=>has(x) && x.log[split]<=3),
    nameA:'高い日', nameB:'低い日', cut:'境目: 4以上 / 3以下'};
}
function slBars(label, extra, a, b, max, fmt){
  const mx = max>0 ? max : 1;
  const w = v=> Math.max(2, Math.min(100, v/mx*100)).toFixed(1);
  return '<div class="sl-o"><div class="sl-ol"><span>'+label+'</span><em>'+extra+'</em></div>'+
    '<div class="sl-b"><div class="sl-bt"><div class="sl-bar a" style="width:'+w(a)+'%"></div></div><span class="sl-v">'+fmt(a)+'</span></div>'+
    '<div class="sl-b"><div class="sl-bt"><div class="sl-bar b" style="width:'+w(b)+'%"></div></div><span class="sl-v">'+fmt(b)+'</span></div></div>';
}
function slMute(label, extra, text){
  return '<div class="sl-o"><div class="sl-ol"><span>'+label+'</span><em>'+extra+'</em></div><p class="sl-mute">'+text+'</p></div>';
}
const SL_MIN_DAYS = 3;
function slRating(v){ return (Math.round(v*10)/10).toFixed(1); }

function renderSleepRelation(){
  const period = ui.sleepRelPeriod || 90;
  const split = ui.sleepSplit || 'duration';
  const metric = ui.sleepActMetric || 'quality';
  const items = sleepPeriodLogs(period);
  let html = '<div class="tab-scroll">'+[[30,'直近30日'],[90,'直近90日'],['all','すべて']].map(p=>slChip('sleep:relperiod', p[0], p[1], period===p[0])).join('')+'</div>';
  html += '<p class="hint-text" style="margin-top:0;">期間内の睡眠の記録: '+items.length+'日分</p>';
  if(items.length < SL_MIN_DAYS){
    html += '<div class="sl-card"><p class="sl-mute">比べられるだけのデータがまだありません。睡眠の記録が'+SL_MIN_DAYS+'日分以上たまると、ここに表示されます。</p></div>';
    return html;
  }

  const out = {};
  items.forEach(x=>{ out[x.date] = sleepDayOutcomes(x.date); });
  const g = sleepSplitGroups(items, split);
  html += '<div class="sl-card"><p class="sl-card-title">同じ日の集中・満足度との関係</p>'+
    '<div class="tab-scroll" style="margin-bottom:8px;">'+[['duration','睡眠時間'],['quality','睡眠の質'],['wakeQuality','寝起き']].map(s=>slChip('sleep:split', s[0], s[1], split===s[0])).join('')+'</div>'+
    '<p class="sl-cut">'+g.cut+'</p>'+
    '<div class="sl-leg"><span><i style="background:#5E6C9E;"></i>'+g.nameA+'('+g.a.length+'日)</span><span><i style="background:var(--sl-b);"></i>'+g.nameB+'('+g.b.length+'日)</span></div>';
  if(g.a.length < SL_MIN_DAYS || g.b.length < SL_MIN_DAYS){
    html += '<p class="sl-mute">この分け方で比べるには、どちらのグループも'+SL_MIN_DAYS+'日以上の記録が必要です。</p>';
  } else {
    [['集中時間','focus'],['集中度','concentration'],['体調','condition'],['気分','mood'],['満足度','sat']].forEach(o=>{
      const A = sleepAvgOf(g.a, x=>out[x.date][o[1]]), B = sleepAvgOf(g.b, x=>out[x.date][o[1]]);
      if(A.n < SL_MIN_DAYS || B.n < SL_MIN_DAYS){
        html += slMute(o[0], A.n+'日 / '+B.n+'日', 'あと'+(SL_MIN_DAYS-Math.min(A.n,B.n))+'日分たまったら表示します');
      } else if(o[1]==='focus'){
        html += slBars(o[0], A.n+'日 / '+B.n+'日', A.avg, B.avg, Math.max(A.avg,B.avg)*1.15, v=>fmtHoursMin(Math.round(v)));
      } else {
        html += slBars(o[0], A.n+'日 / '+B.n+'日', A.avg, B.avg, 5, slRating);
      }
    });
  }
  html += '</div>';

  const counts = {};
  items.forEach(x=>x.log.preActions.forEach(a=>{ counts[a] = (counts[a]||0)+1; }));
  const actions = Object.keys(counts).sort((p,q)=>counts[q]-counts[p]);
  const val = {
    quality: x=>x.log.quality, wakeQuality: x=>x.log.wakeQuality,
    duration: x=>sleepDurationMin(x.log.onsetTime, x.log.wakeTime),
    latency: x=>x.log.bedTime ? (timeToMinutes(x.log.onsetTime)-timeToMinutes(x.log.bedTime)+1440)%1440 : null
  }[metric];
  const fmt = metric==='duration' ? (v=>fmtHoursMin(Math.round(v))) : metric==='latency' ? (v=>Math.round(v)+'分') : slRating;
  html += '<div class="sl-card"><p class="sl-card-title">就寝前の行動ごとの違い</p>'+
    '<div class="tab-scroll" style="margin-bottom:8px;">'+[['quality','睡眠の質'],['wakeQuality','寝起き'],['duration','睡眠時間'],['latency','寝つき']].map(s=>slChip('sleep:actmetric', s[0], s[1], metric===s[0])).join('')+'</div>'+
    '<div class="sl-leg"><span><i style="background:#5E6C9E;"></i>した日</span><span><i style="background:var(--sl-b);"></i>しなかった日</span></div>';
  if(!actions.length){
    html += '<p class="sl-mute">就寝前の行動を記録すると、ここで比べられます。</p>';
  } else {
    let maxV = metric==='duration' ? 600 : metric==='latency' ? 40 : 5;
    actions.forEach(a=>{
      const A = sleepAvgOf(items.filter(x=>x.log.preActions.includes(a)), val);
      const B = sleepAvgOf(items.filter(x=>!x.log.preActions.includes(a)), val);
      const name = escapeHtml(a);
      if(A.n < SL_MIN_DAYS || B.n < SL_MIN_DAYS){
        html += slMute(name, 'した日 '+A.n+' / なし '+B.n, 'あと'+(SL_MIN_DAYS-Math.min(A.n,B.n))+'日分たまったら表示します');
      } else {
        const mv = metric==='latency' ? Math.max(maxV, Math.max(A.avg,B.avg)*1.1) : maxV;
        html += slBars(name, A.n+'日 / '+B.n+'日', A.avg, B.avg, mv, fmt);
      }
    });
    if(metric==='latency') html += '<p class="sl-mute" style="margin-top:6px;">寝つきは、就寝と入眠の両方を入れた日だけで計算します。</p>';
  }
  html += '</div>';
  html += '<p class="hint-text">それぞれ、比べる2グループとも'+SL_MIN_DAYS+'日以上そろったものだけ表示します。傾向を示すもので、原因を示すものではありません。</p>';
  return html;
}

function condNav(delta){
  if((ui.condRange||'week')==='week') ui.condWeekStart = shiftWeek(ui.condWeekStart||addDays(todayStr(),-6), delta);
  else ui.condMonth = shiftMonth(ui.condMonth||todayStr().slice(0,7), delta);
  condScrollPending = ((ui.condRange||'week')==='month') && ui.condMonth===todayStr().slice(0,7);
  render();
}

function condMarkerSvg(shape, color, cls, style, ring){
  const d = COND_SHAPE_D[shape];
  return '<svg class="'+cls+'" viewBox="0 0 24 24"'+(style?' style="'+style+'"':'')+' aria-hidden="true">'+
    (ring ? '<circle cx="12" cy="12" r="15.5" class="cond-mk-ring"/>' : '')+
    '<path d="'+d+'" class="cond-mk-halo"/><path d="'+d+'" style="fill:'+color+';"/></svg>';
}
function renderCondChart(dates){
  const today = todayStr();
  const show = state.condChartShow;
  const rows = dates.map(d=>({d, v:condValuesOn(d)}));
  const N = rows.length, rowH = 38, H = N*rowH;
  let sleepMax = 12, focusMax = 8;
  rows.forEach(r=>{
    if(r.v.sleep!=null) sleepMax = Math.max(sleepMax, Math.ceil(r.v.sleep/60));
    if(r.v.focus!=null) focusMax = Math.max(focusMax, Math.ceil(r.v.focus/60));
  });
  const frac = {
    sat: v=>(v-1)/4, cond: v=>(v-1)/4, mind: v=>(v-1)/4,
    sleep: m=>m/60/sleepMax, focus: m=>m/60/focusMax
  };
  const xp = (k,v)=> 4 + Math.max(0, Math.min(1, frac[k](v)))*92;
  const cy = i => i*rowH + rowH/2;

  let cells = '', bars = '', lines = '', dots = '';
  rows.forEach((r,i)=>{
    const dt = dateObj(r.d), dow = dt.getDay();
    const future = r.d > today;
    const cls = (dow===0||dow===6?' we':'')+(future?' fut':'')+(r.d===today?' tod':'');
    const act = future ? '' : ' data-action="cond:open" data-id="'+r.d+'"';
    const gr = 'grid-row:'+(i+1)+';';
    let diaryInner = '';
    if(condHasMemo(r.v)){
      let tg = r.v.tags.length ? r.v.tags.join('・') : 'メモ';
      const chars = Array.from(tg);
      if(chars.length>10) tg = chars.slice(0,10).join('')+'…';
      diaryInner += '<span class="cond-memo-tag">'+escapeHtml(tg)+'</span>';
    }
    diaryInner += escapeHtml(r.v.diary);
    cells += '<div class="cond-c cond-date'+cls+'" style="'+gr+'grid-column:1;"'+act+'><b>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</b><span>('+DOW_LABEL[DOW_ORDER[dow]]+')</span></div>'+
      '<div class="cond-c cond-cell'+cls+'" style="'+gr+'grid-column:2;"'+act+'></div>'+
      '<div class="cond-c cond-diary'+cls+'" style="'+gr+'grid-column:3;"'+act+'>'+(diaryInner? '<p>'+diaryInner+'</p>' : '')+'</div>';
  });
  if(show.focus){
    rows.forEach((r,i)=>{
      if(r.v.focus==null) return;
      const w = Math.max(0, Math.min(1, frac.focus(r.v.focus)))*92;
      bars += '<i class="cond-bar" style="left:4%;width:'+w.toFixed(2)+'%;top:'+cy(i)+'px;"></i>';
    });
  }
  ['sleep','sat','cond','mind'].forEach(k=>{
    if(!show[k]) return;
    const meta = COND_ITEMS.find(x=>x.key===k), color = meta.color, shape = meta.shape;
    let run = [];
    const flush = ()=>{
      if(run.length>=2) lines += '<polyline points="'+run.map(p=>p.x.toFixed(2)+','+p.y).join(' ')+'" stroke="'+color+'"/>';
      run = [];
    };
    rows.forEach((r,i)=>{
      const v = r.v[k];
      if(v==null){ flush(); return; }
      const x = xp(k,v), y = cy(i);
      run.push({x,y});
      const memo = (k==='cond' && condHasMemo(r.v));
      dots += condMarkerSvg(shape, color, 'cond-dot'+(memo?' memo':''), 'left:'+x.toFixed(2)+'%;top:'+y+'px;', memo);
    });
    flush();
  });
  const layer = '<div class="cond-layer" style="grid-column:2;grid-row:1 / span '+N+';height:'+H+'px;">'+bars+
    '<svg class="cond-svg" viewBox="0 0 100 '+H+'" preserveAspectRatio="none" style="height:'+H+'px;" aria-hidden="true">'+lines+'</svg>'+dots+'</div>';
  return {html:'<div class="cond-chart"><div class="cond-grid" style="grid-template-rows:repeat('+N+','+rowH+'px);">'+cells+layer+'</div></div>', sleepMax, focusMax};
}

  html += '<div class="cond-legend">'+COND_ITEMS.map(it=>
    '<button class="cond-chip'+(show[it.key]?' on':'')+'" style="--c:'+it.color+';" data-action="cond:toggle" data-id="'+it.key+'"><svg class="cond-chip-mk" viewBox="0 0 24 24" aria-hidden="true"><path d="'+COND_SHAPE_D[it.shape]+'"/></svg>'+it.label+'</button>'

  if(show.sleep) scale.push('睡眠=0〜'+ch.sleepMax+'時間');
  if(show.focus) scale.push('集中(棒)=0〜'+ch.focusMax+'時間');
  html += (scale.length
    ? '<p class="hint-text">左端〜右端: '+scale.join(' / ')+'。日付が上から下へ進みます。</p>'
    : '<p class="hint-text">表示する項目を上のボタンで選んでください。</p>');
  html += '<p class="hint-text">行をタップすると、その日の数値・体調メモを見たり、編集できます。体調メモがある日は右の日記欄にタグが出て、体調の●に輪が付きます。</p>';
  return html;
}

function openCondDaySheet(date){
  if(!date || date > todayStr()) return;
  const dl = state.dayLogs[date] || {condition:null, mind:null, diary:'', condTags:[], condNote:''};
  const cur = { sat: state.dayRatings[date] || 0, condition: dl.condition || 0, mind: dl.mind || 0 };
  const options = state.condTagOptions.slice();
  (dl.condTags||[]).forEach(t=>{ if(!options.includes(t)) options.push(t); });
  const sleepMin = condSleepMin(date), focusMin = focusMinutesOnDate(date);
  const chipHtml = t=> '<button type="button" class="sleep-chip'+((dl.condTags||[]).includes(t)?' on':'')+'" data-act="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>';
  const qRow = (label, key, kind)=> '<div class="day-row"><span class="day-row-label">'+label+'</span><div class="day-q '+kind+'" data-q="'+key+'">'+
    [1,2,3,4,5].map(n=>'<button type="button" data-v="'+n+'" class="'+(cur[key]===n?'on':'')+'">'+n+'</button>').join('')+'</div></div>';
  const starRow = '<div class="day-row"><span class="day-row-label">満足度</span><div class="sat-star-row" id="condSatRow">'+
    [1,2,3,4,5].map(n=>'<button type="button" class="sat-star'+(n<=cur.sat?' filled':'')+'" data-v="'+n+'"><svg class="icon"><use href="#'+(n<=cur.sat?'i-star-filled':'i-star')+'"/></svg></button>').join('')+'</div></div>';
  const hasMemo0 = (dl.condTags||[]).length>0 || !!(dl.condNote||'').trim();
  const bodyHtml = '<form id="entityForm">'+
    '<div class="day-facts"><span>睡眠 <b>'+(sleepMin!=null?fmtHoursMin(sleepMin):'—')+'</b></span><span>集中 <b>'+(focusMin>0?fmtHoursMin(focusMin):'—')+'</b></span></div>'+
    starRow+
    qRow('体調','condition','cond')+
    qRow('心','mind','mind')+
    '<p class="day-scale">タップで選択、もう一度タップで解除 / 1 わるい 〜 5 よい</p>'+
    '<div id="condMemoBox" style="display:'+((cur.condition>=1 && cur.condition<=2) || hasMemo0 ? '' : 'none')+';">'+
      '<div class="sleep-label-row"><label class="field-label">体調メモ</label><button type="button" class="link-btn" id="condChipEdit">候補を編集</button></div>'+
      '<div class="sleep-chips" id="condChips">'+options.map(chipHtml).join('')+'<button type="button" class="sleep-chip add" id="condAddChip">+ 追加</button></div>'+
      '<div class="sleep-addrow" id="condAddRow" style="display:none;"><input class="text-input" type="text" id="condNewTag" maxlength="12" placeholder="例: 頭痛">'+
        '<button type="button" class="btn-secondary" id="condAddTag">追加</button></div>'+
      '<p class="hint-text" id="condChipHint" style="display:none;margin:8px 0 0;">削除したいタグをタップ。候補から消えるだけで、過去の記録はそのままです。</p>'+
      '<textarea class="text-input day-diary" name="condNote" rows="2" style="margin-top:8px;" placeholder="例: 生理2日目。お腹が痛くて集中しづらい">'+escapeHtml(dl.condNote||'')+'</textarea>'+
    '</div>'+
    '<label class="field-label">ひとこと日記</label>'+
    '<textarea class="text-input day-diary" name="diary" rows="3" placeholder="今日のひとこと">'+escapeHtml(dl.diary||'')+'</textarea>'+
    '<div class="modal-actions"><button type="submit" class="btn-primary">保存する</button></div></form>';
  openModal(fmtDate(date)+'の記録', bodyHtml);

  const form = document.getElementById('entityForm');
  const memoBox = document.getElementById('condMemoBox');
  const chipsEl = document.getElementById('condChips');
  const addChipBtn = document.getElementById('condAddChip');
  const addRow = document.getElementById('condAddRow');
  const newInp = document.getElementById('condNewTag');
  const editBtn = document.getElementById('condChipEdit');
  const hint = document.getElementById('condChipHint');

  const syncMemo = ()=>{
    const anyOn = chipsEl.querySelector('.sleep-chip.on[data-act]');
    const noteVal = form.querySelector('[name="condNote"]').value.trim();
    const need = (cur.condition>=1 && cur.condition<=2) || !!anyOn || !!noteVal;
    memoBox.style.display = need ? '' : 'none';
  };
  form.querySelectorAll('.day-q').forEach(g=>{
    g.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      const key = g.dataset.q, v = parseInt(b.dataset.v);
      cur[key] = (cur[key]===v) ? 0 : v;
      g.querySelectorAll('button').forEach(x=> x.classList.toggle('on', parseInt(x.dataset.v)===cur[key]));
      if(key==='condition') syncMemo();
    }));
  });
  const starBtns = Array.from(document.querySelectorAll('#condSatRow .sat-star'));
  starBtns.forEach(b=> b.addEventListener('click', ()=>{
    const v = parseInt(b.dataset.v);
    cur.sat = (cur.sat===v) ? 0 : v;
    starBtns.forEach(x=>{
      const on = parseInt(x.dataset.v)<=cur.sat;
      x.classList.toggle('filled', on);
      x.querySelector('use').setAttribute('href', '#'+(on?'i-star-filled':'i-star'));
    });
  }));

  let chipEdit = false;
  editBtn.addEventListener('click', ()=>{
    chipEdit = !chipEdit;
    chipsEl.classList.toggle('editing', chipEdit);
    editBtn.textContent = chipEdit ? '完了' : '候補を編集';
    hint.style.display = chipEdit ? '' : 'none';
  });
  function bindChip(b){
    b.addEventListener('click', ()=>{
      if(chipEdit){
        state.condTagOptions = state.condTagOptions.filter(x=>x!==b.dataset.act);
        saveState();
        b.remove();
      } else {
        b.classList.toggle('on');
      }
    });
  }
  chipsEl.querySelectorAll('.sleep-chip[data-act]').forEach(bindChip);
  addChipBtn.addEventListener('click', ()=>{
    const open = addRow.style.display==='none';
    addRow.style.display = open ? '' : 'none';
    if(open) newInp.focus();
  });
  function addTag(){
    const v = newInp.value.trim();
    if(!v) return;
    const exist = Array.from(chipsEl.querySelectorAll('.sleep-chip[data-act]')).find(b=>b.dataset.act===v);
    if(exist){ exist.classList.add('on'); }
    else {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sleep-chip on'; b.dataset.act = v; b.textContent = v;
      chipsEl.insertBefore(b, addChipBtn);
      bindChip(b);
      if(!state.condTagOptions.includes(v)){ state.condTagOptions.push(v); saveState(); }
    }
    newInp.value = '';
    newInp.focus();
  }
  document.getElementById('condAddTag').addEventListener('click', addTag);
  newInp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addTag(); } });

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    if(cur.sat) state.dayRatings[date] = cur.sat; else delete state.dayRatings[date];
    const l = getDayLog(date);
    l.condition = cur.condition || null;
    l.mind = cur.mind || null;
    l.diary = form.querySelector('[name="diary"]').value.trim();
    l.condNote = form.querySelector('[name="condNote"]').value.trim();
    l.condTags = Array.from(chipsEl.querySelectorAll('.sleep-chip.on[data-act]')).map(b=>b.dataset.act);
    pruneDayLog(date);
    closeModal(); render();
  });
}

function renderCalendarGrid(){
  if(!ui.calendarMonth) ui.calendarMonth = todayStr().slice(0,7);
  const meta = monthMeta(ui.calendarMonth);
  const today = todayStr();
  let html = '<div class="cal-nav"><button class="icon-btn" data-action="cal:prev"><svg class="icon"><use href="#i-back"/></svg></button>'+
    '<span class="cal-month-label">'+meta.y+'年'+meta.m+'月</span>'+
    '<button class="icon-btn" data-action="cal:next"><svg class="icon cal-next-icon"><use href="#i-back"/></svg></button></div>';
  html += '<div class="cal-grid">';
  ['日','月','火','水','木','金','土'].forEach(w=> html += '<div class="cal-dow">'+w+'</div>');
  for(let i=0;i<meta.firstDow;i++) html += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=meta.daysInMonth; day++){
    const dateStr = ui.calendarMonth+'-'+String(day).padStart(2,'0');
    const level = dayActivityLevel(dateStr);
    const isEventEnd = eventsEndingOn(dateStr).length>0;
    const isToday = dateStr===today;
    const isSelected = (ui.calendarSelectedDate||today)===dateStr;
    const sat = state.dayRatings[dateStr];
    html += '<button class="cal-cell '+(isToday?'today':'')+' '+(isSelected?'selected':'')+' '+(isEventEnd?'event-end':'')+'" data-action="cal:select" data-id="'+dateStr+'">'+
      (isEventEnd? '<span class="cal-event-flag"></span>':'')+
      (sat? '<span class="cal-sat-badge" style="'+levelStyle('sat',sat)+'">'+sat+'</span>':'')+
      '<span class="cal-day-num">'+day+'</span>'+(level>0? '<span class="cal-dot lv'+level+'"></span>':'')+
    '</button>';

function reportDiffHtml(cur, prev, point){
  if(prev===0 && cur===0) return '<span class="report-diff flat">先月比 ±0'+(point?'pt':'%')+'</span>';
  if(prev===0) return '<span class="report-diff new">先月データなし</span>';
  const diff = point ? Math.round(cur-prev) : Math.round((cur-prev)/prev*100);
  const cls = diff>0?'up':diff<0?'down':'flat';
  return '<span class="report-diff '+cls+'">先月比 '+(diff>0?'+':'')+diff+(point?'pt':'%')+'</span>';
}

function renderReportTagBreakdown(report, keySuffix){
  let html = '<div class="group-header with-divider"><span class="group-title">タグ別の達成傾向</span></div>';
  const tagList = state.tags.map(t=>({t, count:report.tagCounts[t.id]||0})).sort((a,b)=>b.count-a.count);

/* ===== モーダル ===== */
function openModal(title, bodyHtml){
  const existing = document.getElementById('modalRoot');
  if(existing) existing.remove(); // 別モーダルへの直接切り替え時は即差し替え(古い方をアニメーションで消す必要はない)
  const root = document.createElement('div');
  root.id = 'modalRoot';
  root.className = 'modal-overlay';
  root.innerHTML = '<div class="modal-sheet"><div class="modal-head"><h2>'+escapeHtml(title)+'</h2>'+
    '<button data-action="modal:close" class="icon-btn"><svg class="icon"><use href="#i-close"/></svg></button></div>'+
    '<div class="modal-body">'+bodyHtml+'</div></div>';
  document.body.appendChild(root);
  root.addEventListener('click', (e)=>{ if(e.target===root) closeModal(); });
  root.addEventListener('click', handleClick);
  requestAnimationFrame(()=> root.classList.add('show'));
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  if(!root) return;
  root.classList.remove('show');
  let done = false;
  const finish = ()=>{ if(done) return; done = true; root.remove(); };
  root.addEventListener('transitionend', finish, {once:true});
  setTimeout(finish, 340); // トランジションが発火しない環境向けの保険
}

  function updateModeVisibility(){

      if(newMode==='subtasks') editing.subtasks=subtasks;
      editing.completed = target>0 && progress>=target;
      if(!editing.completed) editing.completedAt=null;

  openModal('集中時間を記録', bodyHtml);
  document.querySelectorAll('.companion-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ document.getElementById('companionInput').value = btn.dataset.companion; });
  });
  const rangeFields = document.getElementById('rangeFields');
  const durationFields = document.getElementById('durationFields');
  function updateVisibility(){
    const m = document.querySelector('input[name="inputMode"]:checked').value;
    rangeFields.style.display = m==='range' ? '' : 'none';
    durationFields.style.display = m==='duration' ? '' : 'none';
  }
  document.querySelectorAll('input[name="inputMode"]').forEach(r=> r.addEventListener('change', updateVisibility));
  updateVisibility();
  document.getElementById('entityForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const mode = fd.get('inputMode')||'range';
    const date = fd.get('date') || today;
    const companion = fd.get('companion')||'';
    const parseLevel = (v)=> (v===null||v==='')? 3 : clampNum(parseInt(v),1,5);
    const condition = parseLevel(fd.get('condition'));
    const mood = parseLevel(fd.get('mood'));
    const concentration = parseLevel(fd.get('concentration'));
    let minutes = 0;
    let savedStart = null, savedEnd = null;
    if(mode==='range'){
      const s = fd.get('startTime'), en = fd.get('endTime');
      if(!s || !en) return;
      const sm = timeToMinutes(s), em = timeToMinutes(en);
      minutes = em - sm; if(minutes<=0) minutes += 1440;
      savedStart = s; savedEnd = en;
    } else {
      const hours = parseFloat(fd.get('hours'));
      if(!hours || hours<=0) return;
      minutes = hours*60;
    }
    addFocusSession(date, minutes, companion, condition, mood, concentration, savedStart, savedEnd);
    queueToast('<svg class="icon"><use href="#i-clock"/></svg>+'+fmtHoursMin(Math.round(minutes))+' 集中時間を記録');
    closeModal(); render();
  });
}

    if(mode==='range'){
      const s = fd.get('startTime'), en = fd.get('endTime');
      if(!s || !en) return;
      const sm = timeToMinutes(s), em = timeToMinutes(en);
      minutes = em - sm; if(minutes<=0) minutes += 1440;
      savedStart = s; savedEnd = en;
    } else {
      const hrs = parseFloat(fd.get('hours'));
      if(!hrs || hrs<=0) return;
      minutes = hrs*60;
    }
    const oldMinutes = f.minutes;
    f.date = date;
    f.minutes = Math.round(minutes);
    f.companion = companion.trim();
    f.condition = condition;
    f.mood = mood;
    f.concentration = concentration;
    f.startTime = savedStart;
    f.endTime = savedEnd;
    state.lifetimeFocusMinutes = Math.max(0, (state.lifetimeFocusMinutes||0) - oldMinutes + f.minutes);
    closeModal(); render();
  });
}

function trimNotesHistory(){
  const MAX_NOTES = 50;
  const entries = [];
  Object.keys(state.goodThings).forEach(date=>{ if(state.goodThings[date]) entries.push({date, type:'good'}); });
  Object.keys(state.funThings).forEach(date=>{ if(state.funThings[date]) entries.push({date, type:'fun'}); });
  if(entries.length>MAX_NOTES){
    entries.sort((a,b)=> a.date.localeCompare(b.date) || (a.type<b.type?-1:1)); // 古い順
    entries.slice(0, entries.length-MAX_NOTES).forEach(en=>{
      if(en.type==='good') delete state.goodThings[en.date];
      else delete state.funThings[en.date];
    });
  }
  const MAX_REFLECTION = 300;
  if(state.reflectionNotes.length>MAX_REFLECTION){
    state.reflectionNotes.sort((a,b)=> (a.time||a.date).localeCompare(b.time||b.date)); // 古い順
    state.reflectionNotes = state.reflectionNotes.slice(state.reflectionNotes.length-MAX_REFLECTION);
  }
}

    case 'advice:delete': if(confirm('このメモを削除しますか?')){ state.adviceNotes = state.adviceNotes.filter(n=>n.id!==id); render(); } break;
    case 'focus:delete': if(confirm('この集中時間の記録を削除しますか?')){ state.focusSessions = state.focusSessions.filter(f=>f.id!==id); render(); } break;
    case 'weeksummary:open': openWeekSummaryModal(); break;
    case 'weeksummary:dismiss': markWeekSummarySeen(); render(); break;
    case 'focus:add': openFocusAddModal(); break;
    case 'focus:editfromcal': openFocusEditModal(id); break;
    case 'focus:editgoal': openFocusGoalModal(); break;
    case 'weeklygoal:edit': openWeeklyGoalModal(); break;
    case 'weeklygoal:clear': state.weeklyGoalText=''; state.weeklyGoalSetDate=null; closeModal(); render(); break;
    case 'todaygoal:edit': openTodayGoalModal(); break;
    case 'todaygoal:clear': state.todayGoalText=''; state.todayGoalSetDate=null; closeModal(); render(); break;
    case 'goodthing:edit': openGoodThingModal(); break;
    case 'daysat:set': {
      const lvl = Number(id);
      const t = todayStr();
      if(state.dayRatings[t]===lvl) delete state.dayRatings[t];
      else state.dayRatings[t] = lvl;
      render();
    } break;
    case 'day:toggle': ui.homeReflectOpen = !ui.homeReflectOpen; render(); break;
    case 'day:cond': setDayLevel(todayStr(), 'condition', Number(id)); break;
    case 'day:mind': setDayLevel(todayStr(), 'mind', Number(id)); break;
    case 'cond:open': openCondDaySheet(id); break;
    case 'cond:range': ui.condRange = id; condScrollPending = (id==='month'); render(); break;
    case 'cond:prev': condNav(-1); break;
    case 'cond:next': condNav(1); break;
    case 'cond:toggle': state.condChartShow[id] = !state.condChartShow[id]; render(); break;
    case 'goodthing:clear': delete state.goodThings[todayStr()]; closeModal(); render(); break;
    case 'goodthing:delete': delete state.goodThings[id]; render(); break;
    case 'funthing:edit': openFunThingModal(); break;
    case 'funthing:clear': delete state.funThings[addDays(todayStr(),1)]; closeModal(); render(); break;
    case 'funthing:delete': delete state.funThings[id]; render(); break;
    case 'streaknote:quickpost': openStreakNoteModal(null); break;
    case 'streaknote:editfromcal': openStreakNoteModal(id); break;
    case 'streaknote:delete': state.reflectionNotes = state.reflectionNotes.filter(n=>n.id!==id); closeModal(); render(); break;
    case 'pool:delete': state.mysteryPool = state.mysteryPool.filter(p=>p.id!==id); render(); break;
    case 'mystery:grant': state.mysteryBoxes++; queueToast('サプライズボールを追加しました'); render(); break;
    case 'data:export': exportData(); break;
    case 'data:reset': confirmReset(); break;
    case 'modal:close': closeModal(); break;
    case 'levelup:close': closeLevelUpCelebration(); break;
    case 'modal:delete': {
      const kind = btn.dataset.kind;
      if(!confirm('本当に削除しますか?')) break;
      if(kind==='daily') state.dailies = state.dailies.filter(x=>x.id!==id);
      if(kind==='ach') state.achievements = state.achievements.filter(x=>x.id!==id);
      if(kind==='reward') state.rewards = state.rewards.filter(x=>x.id!==id);
      if(kind==='goal') state.goals = state.goals.filter(x=>x.id!==id);
      if(kind==='event'){
        state.events = state.events.filter(x=>x.id!==id);
        state.achievements.forEach(a=>{ if(a.eventId===id) a.eventId=null; });
      }
      if(kind==='tag'){
        state.tags = state.tags.filter(x=>x.id!==id);
        state.dailies.forEach(d=>{ d.tagIds = d.tagIds.filter(t=>t!==id); });
        state.achievements.forEach(a=>{ a.tagIds = a.tagIds.filter(t=>t!==id); });
        if(ui.achTagFilter===id) ui.achTagFilter='all';
      }
      if(kind==='advicecat'){
        state.adviceCategories = state.adviceCategories.filter(x=>x.id!==id);
        state.adviceNotes = state.adviceNotes.filter(n=>n.categoryId!==id);
        if(ui.adviceCategory===id) ui.adviceCategory = null;
      }
      if(kind==='pool') state.mysteryPool = state.mysteryPool.filter(x=>x.id!==id);
      if(kind==='sleep') delete state.sleepLogs[id];
      if(kind==='favoriteitem') state.favoriteItems = state.favoriteItems.filter(x=>x.id!==id);
      if(kind==='focus'){
        const f = state.focusSessions.find(x=>x.id===id);
        if(f){ state.lifetimeFocusMinutes = Math.max(0, (state.lifetimeFocusMinutes||0) - f.minutes); }
        state.focusSessions = state.focusSessions.filter(x=>x.id!==id);
      }
      if(kind==='favoritecat'){
        state.favoriteCategories = state.favoriteCategories.filter(x=>x.id!==id);
        state.favoriteItems = state.favoriteItems.filter(f=>f.categoryId!==id);
        if(ui.favoriteCategory===id) ui.favoriteCategory = null;
      }
      closeModal(); render();
      break;
    }
  }
}

function flushToasts(){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const queue = toastQueue.slice();
  toastQueue = [];
  queue.forEach((msg, i)=>{
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className='toast';
      el.innerHTML = msg;
      root.appendChild(el);
      requestAnimationFrame(()=> el.classList.add('show'));
      setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, 2400);
    }, i*350);
  });
}

function animateBars(){
  const entries = [];
  document.querySelectorAll('[data-bar-key]').forEach(el=>{
    const key = el.dataset.barKey;
    const target = el.style.width;
    if(!key || !target) return;
    const prev = barPrevValues[key];
    const forceReset = justLeveledBarKeys.has(key);
    barPrevValues[key] = target; // 次回比較用に今回の値を記憶しておく
    if(prev === target && !forceReset) return; // 値が変わっていなければ動かさない
    const startWidth = (forceReset || prev===undefined) ? '0%' : prev;
    el.style.width = startWidth;
    entries.push([el, target]);
  });
  if(!entries.length) return;
  void document.body.offsetHeight; // 開始幅を一度確定させるための強制リフロー
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      entries.forEach(([el, target])=>{ el.style.width = target; });
    });
  });
}
function render(){
  saveState();
  const app = document.getElementById('app');
  app.innerHTML = ICONS + renderTopBar() + '<main class="main">'+renderTab()+'</main>' + renderNav();
  justCompletedKey = null;
  tabJustActivated = null;
  dailyTabJustSwitched = null;
  menuNavDirection = null;
  animateBars();
  justLeveledBarKeys.clear();
  flushToasts();
  if(condScrollPending){
    condScrollPending = false;
    if(ui.tab==='menu' && ui.menuView==='cond'){
      const el = document.querySelector('.cond-date.tod');
      if(el) requestAnimationFrame(()=>{ el.scrollIntoView({block:'center'}); });
    }
  }
}

document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='importFile'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.dailies)) throw new Error('invalid');
        state = normalizeState(Object.assign(defaultState(), data), data);
        rolloverCheck();
        queueToast('インポートしました');
        render();
      }catch(err){ alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選んでください。'); }
    };
    reader.readAsText(file);
  }
});

function setupPressFeedback(){
  let pressedEl = null;
  function down(e){
    const el = e.target.closest('.btn-primary, .fab-inline');
    if(!el || el.disabled) return;
    el.classList.remove('is-releasing');
    el.classList.add('is-pressed');
    pressedEl = el;
  }
  function up(){
    const el = pressedEl;
    pressedEl = null;
    if(!el) return;
    el.classList.remove('is-pressed');
    if(el.classList.contains('fab-inline')){
      void el.offsetWidth;
      el.classList.add('is-releasing');
      setTimeout(()=>{ el.classList.remove('is-releasing'); }, 420);
    }
  }
  function cancel(){
    if(pressedEl) pressedEl.classList.remove('is-pressed');
    pressedEl = null;
  }
  document.body.addEventListener('pointerdown', down);
  document.body.addEventListener('pointerup', up);
  document.body.addEventListener('pointercancel', cancel);
}

/* ===== 並び替え: ドラッグ&ドロップ ===== */
// data-reorder-kind属性の値と、実際に並び替える配列(のスコープ)を対応させる
function getReorderScope(kind){
  if(kind==='daily') return state.dailies;
  if(kind==='ach') return state.achievements.filter(a=>!a.completed);
  if(kind==='reward') return state.rewards;
  if(kind==='favorite') return state.favoriteItems.filter(f=>f.categoryId===ui.favoriteCategory);
  return [];
}
let dragState = null;
function dragListItems(container){
  return Array.from(container.children).filter(el=>el.classList.contains('drag-item'));
}
function onDragPointerDown(e){
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(e.isPrimary===false) return; // マルチタッチ時の誤動作防止
  const handle = e.target.closest('[data-role="drag-handle"]');
  if(!handle) return;
  const item = handle.closest('.drag-item');
  const container = item && item.closest('.drag-list');
  if(!item || !container) return;
  if(dragState) return; // 既に別の並び替えが進行中なら無視
  e.preventDefault();
  const els = dragListItems(container);
  const originalIndex = els.indexOf(item);
  if(originalIndex<0) return;
  const gap = parseFloat(getComputedStyle(container).rowGap) || 0;
  const rect = item.getBoundingClientRect();
  const items = els.map(el=>{
    const r = el.getBoundingClientRect();
    return {el, id:el.dataset.id, top:r.top+window.scrollY, height:r.height};
  });
  dragState = {
    pointerId:e.pointerId, container, kind:container.dataset.reorderKind,
    item, items, originalIndex, currentIndex:originalIndex,
    startDocY:e.clientY+window.scrollY, itemHeight:rect.height, gap,
    lastClientY:e.clientY, scrollTimer:null
  };
  item.classList.add('dragging');
  document.body.classList.add('is-dragging-reorder');
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  window.addEventListener('pointermove', onDragPointerMove, {passive:false});
  window.addEventListener('pointerup', onDragPointerUp);
  window.addEventListener('pointercancel', onDragPointerCancel);
}
function applyDragShifts(){
  const ds = dragState;
  const step = ds.itemHeight + ds.gap;
  ds.items.forEach((it,i)=>{
    if(i===ds.originalIndex) return;
    let shift = 0;
    if(ds.currentIndex > ds.originalIndex){ // 下方向へ移動中
      if(i>ds.originalIndex && i<=ds.currentIndex) shift = -step;
    } else if(ds.currentIndex < ds.originalIndex){ // 上方向へ移動中
      if(i<ds.originalIndex && i>=ds.currentIndex) shift = step;
    }
    it.el.style.transform = shift? 'translateY('+shift+'px)' : '';
  });
}
function computeDragTargetIndex(draggedCenter){
  const ds = dragState;
  let idx = ds.originalIndex;
  for(let i=ds.originalIndex-1;i>=0;i--){
    const it = ds.items[i];
    if(draggedCenter < it.top + it.height/2) idx = i; else break;
  }
  for(let i=ds.originalIndex+1;i<ds.items.length;i++){
    const it = ds.items[i];
    if(draggedCenter > it.top + it.height/2) idx = i; else break;
  }
  return idx;
}
function updateDragVisual(clientY){
  const ds = dragState;
  if(!ds) return;
  ds.lastClientY = clientY;
  const docY = clientY + window.scrollY;
  const dy = docY - ds.startDocY;
  ds.item.style.transform = 'translateY('+dy+'px)';
  const origTop = ds.items[ds.originalIndex].top;
  const draggedCenter = origTop + dy + ds.itemHeight/2;
  const target = computeDragTargetIndex(draggedCenter);
  if(target!==ds.currentIndex){
    ds.currentIndex = target;
    applyDragShifts();
  }
}
function handleDragAutoScroll(clientY){
  const topLimit = 130, bottomLimit = window.innerHeight - 110;
  let speed = 0;
  if(clientY < topLimit) speed = -(Math.ceil((topLimit-clientY)/4)+2);
  else if(clientY > bottomLimit) speed = Math.ceil((clientY-bottomLimit)/4)+2;
  const ds = dragState;
  if(!ds) return;
  if(speed!==0 && !ds.scrollTimer){
    ds.scrollTimer = setInterval(()=>{
      if(!dragState) return;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const next = clampNum(window.scrollY+speed, 0, Math.max(0,maxScroll));
      if(next!==window.scrollY){ window.scrollTo(0,next); updateDragVisual(dragState.lastClientY); }
    }, 16);
  } else if(speed===0 && ds.scrollTimer){
    clearInterval(ds.scrollTimer);
    ds.scrollTimer = null;
  }
}
function onDragPointerMove(e){
  if(!dragState || e.pointerId!==dragState.pointerId) return;
  e.preventDefault();
  updateDragVisual(e.clientY);
  handleDragAutoScroll(e.clientY);
}
function finishDrag(commit){
  const ds = dragState;
  if(!ds) return;
  if(ds.scrollTimer){ clearInterval(ds.scrollTimer); ds.scrollTimer=null; }
  window.removeEventListener('pointermove', onDragPointerMove);
  window.removeEventListener('pointerup', onDragPointerUp);
  window.removeEventListener('pointercancel', onDragPointerCancel);
  document.body.classList.remove('is-dragging-reorder');

  if(commit && ds.currentIndex!==ds.originalIndex){
    const newIds = ds.items.map(it=>it.id);
    const movedId = newIds.splice(ds.originalIndex,1)[0];
    newIds.splice(ds.currentIndex,0,movedId);
    const scope = getReorderScope(ds.kind);
    newIds.forEach((itemId,i)=>{
      const obj = scope.find(o=>o.id===itemId);
      if(obj) obj.order = i;
    });
  }

  ds.item.classList.remove('dragging');
  ds.item.style.transform = '';
  ds.items.forEach(it=>{ it.el.style.transform=''; });
  dragState = null;
  render();
}
function onDragPointerUp(e){
  if(!dragState || (e.pointerId!==undefined && e.pointerId!==dragState.pointerId)) return;
  finishDrag(true);
}
function onDragPointerCancel(e){
  if(!dragState || (e.pointerId!==undefined && e.pointerId!==dragState.pointerId)) return;
  finishDrag(false); // 中断時は並び順を保存しない(元の状態に戻す)
}
function setupDragReorder(app){
  app.addEventListener('pointerdown', onDragPointerDown);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  setupPressFeedback();
  setupDragReorder(app);
  render();
});
