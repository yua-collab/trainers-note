<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>トレーナーズノート</title>
<meta name="theme-color" content="#FBF6EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トレーナーズノート">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Nunito:wght@400;600;700;800&family=DotGothic16&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EC;
  --paper:#F4ECDA;
  --paper-2:#EFE1C3;
  --tan:#DEC9A0;
  --sage:#8FA37E;
  --sage-dark:#5F7350;
  --olive:#5B6B45;
  --gold:#D2A23B;
  --gold-dark:#A97C1E;
  --taupe:#A6907E;
  --clay:#C1694F;
  --plum:#8E6C88;
  --teal:#5E8C82;
  --rose:#C97B7B;
  --amber:#E0A458;
  --slate:#6B7A8F;
  --poke-red:#D6584A;
  --poke-red-dark:#B8402E;
  --rank-blue:#4A7FC7;
  --rank-blue-dark:#345C94;
  --rank-yellow:#E8B23D;
  --rank-yellow-dark:#B9832A;
  --rank-purple:#8B5FA8;
  --rank-purple-dark:#613D77;
  --rank-black:#3A362F;
  --rank-black-dark:#1E1B17;
  --font-game:'DotGothic16', monospace;
  --font-display:'Mochiy Pop One', 'Zen Maru Gothic', sans-serif;
  --ink:#5B4A36;
  --ink-soft:#8A7A64;
  --line:#E3D6BC;
  --radius-lg:22px;
  --radius-md:16px;
  --shadow:0 1px 4px rgba(120,96,54,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
html{background:var(--cream);}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'DotGothic16','Zen Maru Gothic','Nunito',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent; color:inherit; background:none; border:none; text-align:inherit;}
input,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--olive); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

#app{min-height:100vh; background:var(--cream); position:relative;}
.icon{width:20px;height:20px;}
.icon.big{width:30px;height:30px;}
.icon.xxs{width:13px;height:13px;vertical-align:-2px;}

/* topbar */
.topbar{position:sticky; top:0; z-index:10; background:rgba(251,246,236,0.92); backdrop-filter:blur(6px); padding:14px 16px 10px; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto; width:100%;}
.topbar-row1{display:flex; align-items:center; gap:8px;}
.brand{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
.mascot-mini svg{display:block;}
.brand-name{font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.3px;}
.stat-pill{display:flex; align-items:center; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-weight:700; font-size:13px; flex-shrink:0; font-family:var(--font-game);}
.stat-pill .icon{width:15px;height:15px;}
.stat-pill.leaf{color:var(--olive);}
.stat-pill.flame{color:var(--clay);}
.topbar-row2{display:flex; align-items:center; gap:8px; margin-top:8px;}
.level-badge{background:var(--poke-red); color:#fff; font-weight:700; font-size:11.5px; padding:4px 9px; border-radius:999px; white-space:nowrap; font-family:var(--font-game);}
.exp-bar{flex:1; height:8px; background:var(--paper-2); border-radius:999px; overflow:hidden;}
.exp-bar-fill{height:100%; background:linear-gradient(90deg, var(--sage), var(--gold)); border-radius:999px; transition:width .55s cubic-bezier(.2,.8,.3,1);}
.exp-text{font-size:10.5px; color:var(--ink-soft); white-space:nowrap; font-family:var(--font-game);}

/* main */
.main{padding:14px 16px 104px; max-width:560px; margin:0 auto; width:100%;}
.page-title{font-size:23px; font-weight:900; margin:4px 0 12px; letter-spacing:.5px;}

/* nav */
.navbar{position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; background:var(--paper); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--ink-soft); font-size:10px; padding:6px 2px; border-radius:12px; transition:background .15s ease, color .15s ease;}
.nav-btn.active{color:#fff; font-weight:700; background:var(--poke-red);}
.nav-btn.active .icon{transform:translateY(-1px);}
.nav-btn.active.just-activated{animation:navPill .32s cubic-bezier(.2,.85,.25,1.15);}
.nav-btn.active.just-activated .icon{animation:navIconLift .32s cubic-bezier(.2,.85,.25,1.15);}
@keyframes navPill{0%{transform:scale(.88); opacity:.5;}60%{transform:scale(1.04); opacity:1;}100%{transform:scale(1); opacity:1;}}
@keyframes navIconLift{0%{transform:translateY(0);}55%{transform:translateY(-3.5px);}100%{transform:translateY(-1px);}}

/* cards (使用は最小限に: 目立たせたい1要素だけ) */
.card{background:var(--paper); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); margin-bottom:14px; position:relative;}
.section-title{font-size:15px; font-weight:700; margin:0 0 8px; letter-spacing:.3px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.link-btn{background:none;border:none;color:var(--olive); font-size:12px; font-weight:700; padding:4px;}
.show-more-btn{display:flex; align-items:center; justify-content:center; gap:4px; width:100%; margin:6px 0 2px; padding:9px 0; font-size:12.5px;}
.section-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 8px;}

/* フラットなセクション(ホーム画面など、カードで囲まずに区切り線で分ける) */
.flat-section{margin-bottom:22px;}
.flat-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.flat-section-title{font-size:15px; font-weight:700; margin:0; letter-spacing:.3px;}
.section-divider{border:none; border-top:1px solid var(--line); margin:20px 0;}

.hero-flat{display:flex; align-items:center; gap:14px; margin-bottom:26px; border-left:4px solid var(--poke-red); padding:12px 14px; background:var(--paper);}
.hero-mascot img,.hero-mascot svg{display:block;}
.hero-greet{font-weight:700; margin:0 0 4px; font-size:15.5px;}
.hero-sub{margin:0; font-size:12.5px; color:var(--ink-soft);}

.box-alert{display:flex; align-items:center; gap:10px; background:linear-gradient(135deg, #F3E2B4, var(--paper)); border:1px solid var(--gold); text-align:left; width:100%;}
.box-alert .icon{color:var(--gold-dark);}
.box-alert-title{font-weight:700; font-size:13.5px; margin:0; color:var(--ink);}
.box-alert-sub{font-size:11.5px; color:var(--ink-soft); margin:2px 0 0;}

.streak-row{display:flex; align-items:baseline; justify-content:space-between;}
.streak-num{display:flex; align-items:center; gap:6px; font-size:28px; font-weight:700; color:var(--poke-red); font-family:var(--font-game);}
.streak-num .icon{width:22px;height:22px;}
.streak-num span{font-size:13px; font-weight:700; margin-left:2px; color:var(--ink-soft);}
.streak-best{font-size:12px; color:var(--ink-soft); font-family:var(--font-game);}
.streak-label{font-size:11px; color:var(--ink-soft); margin:2px 0 0;}
.streak-broken-hint, .streak-risk-hint{font-size:11.5px; color:var(--ink-soft); background:var(--paper-2); border-radius:8px; padding:7px 10px; margin:2px 0 10px; display:flex; align-items:center; gap:6px;}
.streak-broken-hint .icon, .streak-risk-hint .icon{color:var(--ink-soft); flex-shrink:0;}

.event-fill-banner{display:flex; align-items:center; gap:7px; width:100%; text-align:left; background:var(--gold); border-radius:10px; padding:7px 12px; margin-bottom:16px;}
.event-fill-banner .icon{color:#fff; flex-shrink:0;}
.event-fill-title{flex:1; min-width:0; font-size:12.5px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.event-fill-days{font-size:10.5px; font-weight:700; color:#fff; white-space:nowrap; flex-shrink:0; font-family:var(--font-game);}

.week-summary-banner{display:flex; align-items:center; gap:9px; width:100%; background:linear-gradient(135deg, var(--paper-2), var(--paper)); border:1px solid var(--gold); border-radius:10px; padding:8px 8px 8px 12px; margin-bottom:16px;}
.week-summary-banner .icon{color:var(--gold-dark); flex-shrink:0;}
.week-summary-main{flex:1; min-width:0; display:block; text-align:left; background:none; border:none; padding:2px 0;}
.week-summary-title{font-size:12px; font-weight:700; color:var(--ink); margin:0;}
.week-summary-sub{font-size:11.5px; color:var(--ink-soft); margin:2px 0 0;}
.week-summary-close{flex-shrink:0; padding:8px; color:var(--ink-soft);}

.goal-mini{display:block; width:100%; text-align:left; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);}
.goal-mini-combo{margin-bottom:16px;}
.goal-mini-combo .goal-mini{margin-bottom:0; padding-bottom:12px; padding-top:12px; border-bottom:1px dashed var(--line);}
.goal-mini-combo .goal-mini:first-child{padding-top:0;}
.goal-mini-combo .goal-mini:last-child{border-bottom:none; padding-bottom:0;}

.week-strip{display:flex; gap:4px; margin-top:14px;}
.week-strip-cell{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--paper); border-radius:10px; padding:8px 2px; border:1.5px solid transparent;}
.week-strip-cell.today{border-color:var(--gold);}
.week-strip-dow{font-size:9.5px; color:var(--ink-soft); font-weight:700;}
.week-strip-num{font-size:12px; font-weight:700; color:var(--ink); font-family:var(--font-game);}
.week-strip-dot-empty{width:6px; height:6px;}
.advice-nudge{display:flex; align-items:center; gap:4px; margin-top:14px; font-size:11.5px;}
.goal-mini-head{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px;}
.goal-mini-head .icon{color:var(--ink-soft);}
.goal-mini-text{font-size:13.5px; font-weight:700; color:var(--ink); margin:0; word-break:break-word; line-height:1.4;}
.goal-mini-text.placeholder{color:var(--ink-soft); font-weight:400;}

.week-chart-wrap{margin-top:16px;}
.week-chart-label{font-size:11.5px; color:var(--ink-soft); margin:0 0 4px;}
.week-chart{width:100%; height:98px; display:block;}
.home-calendar-wrap{margin-top:16px;}

/* 集中時間 */
.focus-today-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.rank-badge-row{display:flex; align-items:center; gap:13px; margin-bottom:18px;}
.rank-ring-wrap{position:relative; width:68px; height:68px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.rank-ring-svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); pointer-events:none;}
.rank-ring-wrap .rank-circle{position:relative; z-index:1;}
.rank-circle{width:54px; height:54px; border-radius:50%; position:relative; flex-shrink:0; box-shadow:0 3px 9px rgba(0,0,0,0.18);}
.rank-circle-img{width:100%; height:100%; border-radius:50%; display:block; object-fit:cover;}
.rank-circle-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.35); font-family:var(--font-game); pointer-events:none;}
.rank-circle.champion{box-shadow:0 3px 9px rgba(0,0,0,0.25);}
.rank-info{flex:1; min-width:0;}
.rank-label-big{font-size:15.5px; font-weight:900; color:var(--ink); margin:0 0 2px;}
.rank-next-hint{font-size:11px; color:var(--ink-soft); margin:0;}
.focus-today-value{font-size:22px; font-weight:700; margin:0; color:var(--ink); font-family:var(--font-game);}
.focus-today-label{font-size:11px; color:var(--ink-soft); margin:2px 0 0;}
.focus-week-progress{margin-bottom:6px;}

.mini-progress-item{margin-bottom:10px;}
.mini-progress-item:last-child{margin-bottom:0;}
.mini-progress-head{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:4px; gap:8px;}
.mini-progress-head span:last-child{font-family:var(--font-game);}
.mini-progress-head span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-progress-sub{font-size:11px; color:var(--ink-soft); margin:4px 0 0;}
.mini-event-item{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12.5px;}
.event-dot{width:8px;height:8px; border-radius:50%; background:var(--sage); flex-shrink:0;}
.event-dot.gold{background:var(--gold);} .event-dot.muted{background:var(--taupe);}
.mini-event-title{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mini-event-badge{font-size:10.5px; padding:3px 8px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); white-space:nowrap; flex-shrink:0;}
.mini-event-badge.gold{background:#F3E2B4; color:var(--gold-dark);}

.empty-mini{padding:10px 0; text-align:center; color:var(--ink-soft); font-size:12.5px;}
.empty-mini-sub{font-size:11px; margin-top:2px;}

/* タブ(すべて/タグ別 切り替え) */
.tab-scroll{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.tab-scroll::-webkit-scrollbar{display:none;}
.tab-chip{flex-shrink:0; padding:6px 13px; border-radius:999px; font-size:12px; font-weight:700; background:none; color:var(--ink-soft); border:1.5px solid var(--line); white-space:nowrap;}
.tab-chip.active{background:var(--olive); color:#fff; border-color:var(--olive);}

/* デイリー/アチーブ 切り替え(スライドスイッチ) */
.seg-switch{position:relative; display:flex; flex-shrink:0; width:150px; background:var(--paper-2); border-radius:11px; padding:3px;}
.seg-switch-thumb{position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); background:var(--paper); border-radius:8px; box-shadow:0 1px 4px rgba(91,74,54,0.16); transform:translateX(0%);}
.seg-switch-thumb.pos-ach{transform:translateX(100%);}
.seg-switch-btn{position:relative; z-index:1; flex:1; padding:7px 0; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--ink-soft); background:none; border:none; white-space:nowrap; text-align:center;}
.seg-switch-btn.active{color:var(--ink);}
@keyframes thumbSlideRight{
  0%{transform:translateX(0%) scaleX(1);}
  55%{transform:translateX(108%) scaleX(1.14);}
  78%{transform:translateX(92%) scaleX(0.94);}
  100%{transform:translateX(100%) scaleX(1);}
}
@keyframes thumbSlideLeft{
  0%{transform:translateX(100%) scaleX(1);}
  55%{transform:translateX(-8%) scaleX(1.14);}
  78%{transform:translateX(8%) scaleX(0.94);}
  100%{transform:translateX(0%) scaleX(1);}
}
.seg-switch-thumb.slide-right{animation:thumbSlideRight .42s cubic-bezier(.22,.9,.28,1.05);}
.seg-switch-thumb.slide-left{animation:thumbSlideLeft .42s cubic-bezier(.22,.9,.28,1.05);}

/* アチーブの達成/未達成グループ */
.group-header{display:flex; align-items:center; justify-content:space-between; margin:2px 0 8px;}
.group-header.with-divider{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
.group-title{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.group-header .group-title:last-child{font-family:var(--font-game);}

.bar{height:10px; background:var(--paper-2); border-radius:999px; overflow:hidden;}
.bar.thin{height:5px;}
.bar-fill{height:100%; border-radius:999px; transition:width .55s cubic-bezier(.2,.8,.3,1); display:block;}
.bar-fill.sage{background:var(--sage);}
.bar-fill.gold{background:var(--gold);}
.bar-fill.olive{background:var(--olive);}
.bar-fill.taupe{background:var(--taupe);}
.bar-fill.clay{background:var(--clay);}
.bar-fill.plum{background:var(--plum);}
.bar-fill.teal{background:var(--teal);}
.bar-fill.rose{background:var(--rose);}
.bar-fill.amber{background:var(--amber);}
.bar-fill.slate{background:var(--slate);}

.list-head{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.menu-pane-forward{animation:menuPaneInForward .36s cubic-bezier(.2,.85,.25,1);}
.menu-pane-back{animation:menuPaneInBack .36s cubic-bezier(.2,.85,.25,1);}
@keyframes menuPaneInForward{from{opacity:0; transform:translateX(20px) scale(.985);}to{opacity:1; transform:translateX(0) scale(1);}}
@keyframes menuPaneInBack{from{opacity:0; transform:translateX(-20px) scale(.985);}to{opacity:1; transform:translateX(0) scale(1);}}
.list-head.sub{margin-top:22px;}
.list-head .page-title{margin:0; flex:1; min-width:0;}
.list-head-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}
.chip-btn{background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12px; font-weight:700; color:var(--ink-soft);}
.chip-btn.active{background:var(--olive); color:#fff; border-color:var(--olive);}
.fab-inline{width:36px;height:36px; border-radius:50%; background:var(--gold); border:none; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); flex-shrink:0; transition:transform .15s cubic-bezier(.22,.8,.3,1);}
.fab-inline.is-pressed{transform:scale(.82) rotate(-10deg);}
.fab-inline.is-releasing{animation:fabRelease .4s cubic-bezier(.2,.9,.25,1.25);}
@keyframes fabRelease{0%{transform:scale(.82) rotate(-10deg);}45%{transform:scale(1.08) rotate(5deg);}72%{transform:scale(.97) rotate(-1.5deg);}100%{transform:scale(1) rotate(0deg);}}
.back-btn{width:32px;height:32px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;}
.leaf-balance{display:flex; align-items:center; gap:4px; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:700; color:var(--olive); margin-left:auto; font-family:var(--font-game);}

.list-sub-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--ink-soft); margin:0 0 10px;}
.list-sub-head span:last-child{font-family:var(--font-game);}

.card-list{display:flex; flex-direction:column; gap:6px;}
.item-card{display:flex; align-items:flex-start; gap:9px; background:var(--paper); border-radius:var(--radius-md); padding:9px 11px; box-shadow:var(--shadow); position:relative;}
.item-card.done{opacity:.6;}
.item-card.locked{opacity:.5;}
.item-body{flex:1; min-width:0; padding-top:3px;}
.item-title{font-weight:700; font-size:15px; margin:0 0 4px; word-break:break-word; line-height:1.4;}
.item-title.muted-text{color:var(--ink-soft); font-weight:400; font-style:italic;}
.item-meta{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:4px; align-items:center;}
.item-progress-text{font-size:10px; color:var(--ink-soft); margin:3px 0 0; font-family:var(--font-game);}

.check-circle{width:28px;height:28px; border-radius:50%; border:2px solid var(--sage); background:#fff; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; margin-top:2px; padding:0;}
.check-circle.checked{background:var(--sage); border-color:var(--sage);}
.check-circle.star{border-color:var(--gold); font-weight:800; color:var(--gold-dark); font-size:11px;}
.check-circle.star.checked{background:var(--gold); color:#fff;}
.check-circle:disabled{opacity:.5;}
.check-circle.just-completed{animation:checkPop .34s cubic-bezier(.2,.9,.25,1.35);}
.check-circle.just-completed svg.icon{animation:checkIconIn .28s .06s cubic-bezier(.2,.9,.25,1) backwards;}
@keyframes checkPop{0%{transform:scale(.8);}55%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes checkIconIn{0%{transform:scale(.4) rotate(-10deg); opacity:0;}100%{transform:scale(1) rotate(0deg); opacity:1;}}
@media(prefers-reduced-motion:reduce){
  .check-circle.just-completed, .check-circle.just-completed svg.icon{animation:none;}
}

.reorder-controls{display:flex; align-items:center; flex-shrink:0;}
.drag-handle{width:44px; height:44px; border-radius:8px; background:transparent; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; padding:0; touch-action:none; cursor:grab;}
.drag-handle:active{cursor:grabbing; color:var(--ink);}
.drag-handle .icon{width:20px;height:20px;}
.drag-item{transition:transform .18s cubic-bezier(.2,.7,.3,1);}
.drag-item.dragging{transition:none; position:relative; z-index:40; box-shadow:0 8px 20px rgba(91,74,54,0.22); opacity:.98;}
body.is-dragging-reorder{-webkit-user-select:none; user-select:none;}

.tag-chip{font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; white-space:nowrap;}
.tag-chip.sage{background:var(--sage);} .tag-chip.gold{background:var(--gold);} .tag-chip.olive{background:var(--olive);}
.tag-chip.taupe{background:var(--taupe);} .tag-chip.clay{background:var(--clay);}
.tag-chip.plum{background:var(--plum);} .tag-chip.teal{background:var(--teal);} .tag-chip.rose{background:var(--rose);}
.tag-chip.amber{background:var(--amber);} .tag-chip.slate{background:var(--slate);}
.diff-chip{font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); white-space:nowrap; font-family:var(--font-game);}
.event-badge{font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
.event-badge.gold{background:#F3E2B4; color:var(--gold-dark);}
.event-badge.sage{background:#DCE6D2; color:var(--sage-dark);}
.event-badge.muted{background:var(--paper-2); color:var(--taupe);}
.event-badge.clay{background:#EFD9CE; color:var(--clay);}
.tag-level{font-size:11px; font-weight:700; color:var(--ink-soft);}

.mystery-card{border:1px solid var(--gold); padding:11px 13px;}
.mystery-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.mystery-head .icon{width:20px;height:20px;}
.mystery-head .section-title{font-size:13.5px; margin:0;}
.mystery-sub{font-size:10.5px; color:var(--ink-soft); margin:1px 0 0;}
.mystery-actions{display:flex; align-items:center; justify-content:space-between;}
.mystery-count{font-size:12px; font-weight:700; color:var(--ink-soft); font-family:var(--font-game);}
.history-list{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
.history-item{font-size:11.5px; color:var(--ink-soft); margin:3px 0;}
.history-item.done{opacity:.55; text-decoration:line-through;}
.reward-card{align-items:center;}
.reward-cost{font-size:12px; color:var(--gold-dark); font-weight:700; margin:0; font-family:var(--font-game);}

/* ごほうびチケット */
.ticket-card{display:flex; align-items:stretch; background:var(--paper); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
.ticket-main{flex:1; min-width:0; padding:9px 11px;}
.ticket-title{font-weight:700; font-size:13.5px; margin:0 0 6px; word-break:break-word; line-height:1.35;}
.ticket-sub{font-size:10px; color:var(--ink-soft); margin:4px 0 0; font-family:var(--font-game);}
.ticket-sub.afford{color:var(--sage-dark); font-weight:700;}
.ticket-stub{width:68px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:6px; border-left:2px dashed var(--tan); background:var(--paper-2);}
.ticket-cost{font-size:11.5px; font-weight:700; color:var(--gold-dark); margin:0; font-family:var(--font-game); display:flex; align-items:center; gap:2px; white-space:nowrap;}
.ticket-stub .btn-primary.sm{padding:6px 10px; font-size:11.5px;}

/* 履歴(実行済みチェック) */
.history-check-list{display:flex; flex-direction:column;}
.history-check-row{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px dashed var(--line);}
.history-check-row:last-child{border-bottom:none;}
.history-check-row.done{opacity:.55;}
.history-check-row input[type="checkbox"]{width:19px;height:19px; accent-color:var(--sage); flex-shrink:0;}
.history-check-icon{color:var(--ink-soft); flex-shrink:0;}
.history-check-body{flex:1; min-width:0; display:flex; flex-direction:column;}
.history-check-title{font-size:14px; font-weight:700; word-break:break-word; line-height:1.4;}
.history-check-row.done .history-check-title{text-decoration:line-through;}
.history-check-sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px; font-family:var(--font-game);}

/* ★選択(サプライズボールのレア度) */
.star-select{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 16px;}
.star-option{position:relative; display:block;}
.star-option input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.star-option span{display:inline-flex; align-items:center; padding:7px 11px; border-radius:10px; border:1.5px solid var(--line); font-size:13px; color:var(--gold-dark); background:#fff; letter-spacing:1px;}
.star-option input:checked + span{background:var(--gold); color:#fff; border-color:var(--gold);}

/* 好きなものリスト */
.favorite-list{display:flex; flex-direction:column; background:var(--paper); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:2px 12px;}
.favorite-list-row{display:flex; align-items:center; gap:8px; padding:11px 0; border-bottom:1px dashed var(--line); background:var(--paper);}
.favorite-list-row:last-child{border-bottom:none;}
.favorite-list-row.dragging{border-radius:10px; border-bottom-color:transparent;}
.favorite-list-title{flex:1; min-width:0; font-size:14px; font-weight:600; word-break:break-word; line-height:1.4; margin:0;}
.favorite-list-link{flex-shrink:0; display:flex; align-items:center; gap:2px; font-size:11px; color:var(--sage-dark); font-weight:700; padding:4px 2px;}
.favorite-list-caret{flex-shrink:0; color:var(--ink-soft); opacity:.5;}
.favorite-add-row{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; background:none; border:1.5px dashed var(--tan); border-radius:var(--radius-md); padding:11px; margin-top:8px; font-size:13px; font-weight:700; color:var(--olive);}
.fav-star-btn{flex-shrink:0; background:none; border:none; padding:3px; color:var(--line); line-height:0;}
.fav-star-btn.starred{color:var(--gold);}

/* 体調・気分・集中度レベルスライダー */
.level-slider-row{display:flex; gap:14px; margin:6px 0 8px;}
.level-slider-row .level-slider-item{flex:1 1 0%; width:0; min-width:0;}
.level-slider-item.full{margin:0 0 16px;}
.level-slider-item{min-width:0;}
.level-slider-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;}
.level-slider-label{font-size:11.5px; font-weight:700; color:var(--ink-soft);}
.level-slider-value{font-size:11px; font-weight:700; padding:1px 8px; border-radius:8px; font-family:var(--font-game); min-width:16px; text-align:center;}
.level-slider{-webkit-appearance:none; appearance:none; display:block; width:100%; min-width:0; box-sizing:border-box; height:5px; border-radius:4px; background:var(--line); outline:none; margin:7px 0 7px; cursor:pointer;}
.level-slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:17px;height:17px; border-radius:50%; background:var(--paper); border:3px solid var(--ink); cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.22);}
.level-slider::-moz-range-thumb{width:17px;height:17px; border-radius:50%; background:var(--paper); border:3px solid var(--ink); cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.22);}
.level-slider.cond{accent-color:rgb(79,108,140);}
.level-slider.mood{accent-color:rgb(138,79,121);}
.level-slider.conc{accent-color:rgb(63,140,120);}
.level-dot-row{display:flex; gap:4px; margin-top:5px; flex-wrap:wrap;}
.level-dot{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:7px; font-family:var(--font-game); line-height:1.4; white-space:nowrap;}

/* 今日の満足度 */
.sat-star-row{display:flex; gap:8px; justify-content:center; padding:6px 0 2px;}
.sat-star{background:none; border:none; padding:4px; color:var(--line); line-height:0;}
.sat-star .icon{width:26px;height:26px;}
.sat-star.filled{color:var(--gold);}
.cal-sat-badge{position:absolute; top:2px; left:2px; font-size:8px; font-weight:700; width:14px; height:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-game); line-height:1;}
.cal-sat-badge.inline{position:static; display:inline-flex;}

/* タイムライン(活動記録) */
.timeline-list{position:relative; padding-left:40px; margin-top:4px;}
.timeline-list::before{content:''; position:absolute; left:13px; top:4px; bottom:4px; width:2px; background:var(--line);}
.timeline-item{position:relative; padding-bottom:18px;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-icon-wrap{position:absolute; left:-40px; top:0; width:28px; height:28px; border-radius:50%; background:var(--cream); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); z-index:1;}
.timeline-icon-wrap .icon{width:14px;height:14px;}
.timeline-icon-wrap.gold{border-color:var(--gold); color:var(--gold-dark); background:#F3E2B4;}
.timeline-body{padding-top:3px;}
.timeline-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.timeline-label{font-size:11px; font-weight:700; color:var(--ink-soft); margin:0;}
.timeline-time{font-size:10.5px; color:var(--ink-soft); font-family:var(--font-game); white-space:nowrap; flex-shrink:0;}
.timeline-title{font-size:14px; font-weight:700; margin:2px 0 0; word-break:break-word; line-height:1.4;}
.timeline-note{font-size:11.5px; color:var(--ink-soft); margin:3px 0 0; line-height:1.5; word-break:break-word; padding:6px 8px; background:var(--paper); border-radius:8px;}

/* ステータス画面 */
.stat-list{display:flex; flex-direction:column; gap:14px; margin:14px 0 24px;}
.stat-row{display:flex; align-items:center; gap:10px;}
.stat-icon-wrap{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.stat-icon-wrap.rose{background:var(--rose);} .stat-icon-wrap.clay{background:var(--clay);} .stat-icon-wrap.slate{background:var(--slate);}
.stat-icon-wrap.plum{background:var(--plum);} .stat-icon-wrap.teal{background:var(--teal);} .stat-icon-wrap.gold{background:var(--gold);}
.stat-main{flex:1; min-width:0;}
.stat-main-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:5px;}
.stat-name{font-size:13px; font-weight:700; color:var(--ink);}
.stat-value{font-size:15px; font-weight:700; color:var(--ink); font-family:var(--font-game);}
.stat-value .stat-cap{font-size:10.5px; font-weight:400; color:var(--ink-soft); margin-left:2px;}
.stat-bar-track{height:9px; background:var(--paper-2); border-radius:999px; overflow:hidden;}
.stat-bar-fill{height:100%; border-radius:999px; transition:width .55s cubic-bezier(.2,.8,.3,1);}
.stat-bar-fill.rose{background:var(--rose);} .stat-bar-fill.clay{background:var(--clay);} .stat-bar-fill.slate{background:var(--slate);}
.stat-bar-fill.plum{background:var(--plum);} .stat-bar-fill.teal{background:var(--teal);} .stat-bar-fill.gold{background:var(--gold);}
.stat-cap-hint{font-size:11px; color:var(--ink-soft); margin:0 0 14px;}
.stat-unassigned-hint{font-size:11px; color:var(--ink-soft); margin:-6px 0 16px; padding:8px 10px; background:var(--paper); border-radius:10px;}
.stat-select{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px;}
.stat-option{position:relative; display:inline-flex;}
.stat-option input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1;}
.stat-option span{display:inline-flex; align-items:center; padding:7px 12px; border-radius:999px; border:1.5px solid var(--line); font-size:12.5px; font-weight:700; color:var(--ink-soft); background:#fff; white-space:nowrap;}
.stat-option input:checked + span{color:#fff; border-color:transparent;}
.stat-option.rose input:checked + span{background:var(--rose);} .stat-option.clay input:checked + span{background:var(--clay);}
.stat-option.slate input:checked + span{background:var(--slate);} .stat-option.plum input:checked + span{background:var(--plum);}
.stat-option.teal input:checked + span{background:var(--teal);} .stat-option.gold input:checked + span{background:var(--gold);}
.stat-option.none input:checked + span{background:var(--ink-soft);}
.stat-tag-badge{font-size:9.5px; color:var(--ink-soft); font-weight:700;}
.flat-subtitle{font-size:13px; font-weight:700; color:var(--ink-soft); margin:0;}

/* 今日のいいこと/明日の楽しみ(左右並び、目標欄と区別できる配色) */
.notes-duo{display:flex; gap:0; margin-bottom:16px; background:var(--paper); border-radius:var(--radius-md); padding:12px 14px; border-left:4px solid var(--gold);}
.notes-duo .goal-mini{flex:1; min-width:0; width:auto; margin-bottom:0; padding:0 12px; border-bottom:none;}
.notes-duo .goal-mini:first-child{padding-left:0; padding-right:14px; border-right:1px dashed var(--line);}
.notes-duo .goal-mini:last-child{padding-right:0;}
.notes-duo .goal-mini-head{color:var(--gold-dark);}
.notes-duo .goal-mini-head span:first-child{display:inline-flex; align-items:center; gap:4px;}
.notes-duo-preview{font-size:10.5px; color:var(--ink-soft); margin:0 0 4px; line-height:1.4; word-break:break-word; font-style:italic;}

/* フラットな行リスト(目標/経験値など) */
.flat-row-list{display:flex; flex-direction:column;}
.flat-row{display:block; width:100%; text-align:left; background:none; border:none; padding:10px 2px; border-bottom:1px dashed var(--line);}
.flat-row:last-child{border-bottom:none;}
.flat-row-head{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
.flat-row-title{font-weight:700; font-size:14px; margin:0 0 4px; word-break:break-word; line-height:1.4;}
.flat-row-sub{font-size:10px; color:var(--ink-soft); margin:4px 0 0; font-family:var(--font-game);}

/* いいこと・楽しみの記録(非カード) */
.notes-history-list{display:flex; flex-direction:column;}
.notes-history-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line);}
.notes-history-row:last-child{border-bottom:none;}
.notes-history-body{flex:1; min-width:0;}
.notes-history-meta{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
.notes-history-type{font-size:10px; font-weight:700; color:var(--ink-soft);}
.notes-history-date{font-size:10px; color:var(--ink-soft); font-family:var(--font-game);}
.notes-history-text{font-size:14px; font-weight:600; margin:0; line-height:1.5; word-break:break-word;}

.btn-primary{background:var(--gold); color:#fff; border:none; border-radius:14px; padding:12px 18px; font-weight:700; font-size:14px; box-shadow:var(--shadow); transition:transform .12s cubic-bezier(.22,.8,.3,1), box-shadow .12s ease;}
.btn-primary.is-pressed{transform:scale(.95); box-shadow:none;}
.btn-primary.sm{padding:8px 14px; font-size:12.5px; border-radius:10px;}
.btn-primary:disabled{background:var(--paper-2); color:var(--ink-soft); box-shadow:none;}
.btn-secondary{background:#fff; color:var(--olive); border:1.5px solid var(--sage); border-radius:14px; padding:11px 18px; font-weight:700; font-size:13.5px;}
.btn-secondary.full{width:100%; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px;}
.btn-danger{background:none; color:var(--clay); border:1.5px solid #E3B7A6; border-radius:14px; padding:11px 18px; font-weight:700; font-size:13.5px;}
.btn-danger.full{width:100%; display:flex; align-items:center; justify-content:center; gap:6px;}
.icon-btn{background:none; border:none; color:var(--ink-soft); padding:6px; flex-shrink:0;}
.file-label{cursor:pointer;}

.empty-state{text-align:center; padding:36px 16px;}

.empty-state svg{margin-bottom:10px;}
.empty-title{font-weight:700; font-size:14.5px; margin:0 0 4px;}
.empty-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}

.menu-panel{background:var(--paper); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden;}
.menu-row{display:flex; align-items:center; gap:12px; background:none; border:none; border-bottom:1px solid var(--line); padding:15px 16px; font-size:15px; font-weight:700; color:var(--ink); width:100%; text-align:left;}
.menu-row:last-child{border-bottom:none;}
.menu-row-label{flex:1; text-align:left;}
.menu-row-sub{font-size:11.5px; color:var(--ink-soft); font-weight:400; font-family:var(--font-game);}
.menu-row-chevron{color:var(--ink-soft); flex-shrink:0;}
.hint-text{font-size:11.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.7;}

/* バッジケース */
.badge-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px 8px;}
.badge-cell{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;}
.badge-icon-wrap{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--paper); box-shadow:var(--shadow); flex-shrink:0; box-sizing:border-box;}
.badge-icon-wrap.tier-bronze{border:3px solid #B08D57;}
.badge-icon-wrap.tier-silver{border:3px solid #AEB7C0;}
.badge-icon-wrap.tier-gold{border:3px solid var(--gold);}
.badge-icon-wrap.tier-platinum{border:3px solid #8FC1D9;}
.badge-icon-wrap:not(.locked){box-shadow:var(--shadow);}
.badge-icon-wrap .icon{width:30px; height:30px;}
.badge-icon-wrap.locked{color:var(--line); background:var(--paper-2); box-shadow:none;}
.badge-icon-wrap.sage{color:var(--sage);} .badge-icon-wrap.gold{color:var(--gold);} .badge-icon-wrap.olive{color:var(--olive);}
.badge-icon-wrap.taupe{color:var(--taupe);} .badge-icon-wrap.clay{color:var(--clay);}
.badge-icon-wrap.plum{color:var(--plum);} .badge-icon-wrap.teal{color:var(--teal);} .badge-icon-wrap.rose{color:var(--rose);}
.badge-icon-wrap.amber{color:var(--amber);} .badge-icon-wrap.slate{color:var(--slate);}
.badge-name{font-size:11.5px; font-weight:700; color:var(--ink); word-break:break-word;}
.badge-status{font-size:9.5px; color:var(--ink-soft); line-height:1.3;}

.modal-overlay{position:fixed; inset:0; background:rgba(70,55,35,0.35); z-index:50; display:flex; align-items:flex-end; opacity:0; transition:opacity .28s cubic-bezier(.2,.8,.3,1);}
.modal-overlay.show{opacity:1;}
.modal-sheet{background:var(--cream); width:100%; max-width:560px; margin:0 auto; border-radius:24px 24px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; overflow-x:hidden; transform:translateY(22px) scale(.98); transition:transform .28s cubic-bezier(.2,.8,.3,1);}
.modal-overlay.show .modal-sheet{transform:translateY(0) scale(1);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h2{font-size:16px; margin:0;}
.field-label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 6px;}
.field-label:first-child{margin-top:0;}
.text-input{width:100%; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:11px 12px; font-size:14px; color:var(--ink);}
input[type="date"].text-input, input[type="time"].text-input{-webkit-appearance:none; appearance:none; min-width:0; max-width:100%; display:block;}
.text-input:focus{outline:none; border-color:var(--sage);}
.diff-select{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.diff-option{position:relative; display:block;}
.diff-option input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.diff-option span{display:block; text-align:center; font-size:10px; font-weight:700; border:1.5px solid var(--line); border-radius:12px; padding:8px 2px; color:var(--ink-soft); line-height:1.5;}
.diff-option input:checked + span{border-color:var(--gold); background:#FBF0D6; color:var(--gold-dark);}
.tag-select{display:flex; flex-wrap:wrap; gap:8px;}
.tag-check{position:relative; display:inline-block;}
.tag-check input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.tag-check span{display:inline-block; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line); font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.tag-check.sage input:checked + span{background:var(--sage); color:#fff; border-color:transparent;}
.tag-check.gold input:checked + span{background:var(--gold); color:#fff; border-color:transparent;}
.tag-check.olive input:checked + span{background:var(--olive); color:#fff; border-color:transparent;}
.tag-check.taupe input:checked + span{background:var(--taupe); color:#fff; border-color:transparent;}
.tag-check.clay input:checked + span{background:var(--clay); color:#fff; border-color:transparent;}
.tag-check.plum input:checked + span{background:var(--plum); color:#fff; border-color:transparent;}
.tag-check.teal input:checked + span{background:var(--teal); color:#fff; border-color:transparent;}
.tag-check.rose input:checked + span{background:var(--rose); color:#fff; border-color:transparent;}
.tag-check.amber input:checked + span{background:var(--amber); color:#fff; border-color:transparent;}
.tag-check.slate input:checked + span{background:var(--slate); color:#fff; border-color:transparent;}
.color-select{display:flex; gap:10px; flex-wrap:wrap;}
.color-option{width:34px;height:34px; border-radius:50%; position:relative; display:block;}
.color-option input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.color-option input:checked{outline:3px solid var(--ink); outline-offset:2px; border-radius:50%;}
.color-option.sage{background:var(--sage);} .color-option.gold{background:var(--gold);}
.color-option.olive{background:var(--olive);} .color-option.taupe{background:var(--taupe);} .color-option.clay{background:var(--clay);}
.color-option.plum{background:var(--plum);} .color-option.teal{background:var(--teal);} .color-option.rose{background:var(--rose);}
.color-option.amber{background:var(--amber);} .color-option.slate{background:var(--slate);}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions .btn-primary{flex:1;}
.modal-actions .btn-danger{flex-shrink:0;}

/* 頻度・曜日選択 */
.freq-select{display:flex; gap:8px; margin-bottom:10px;}
.freq-option{position:relative; display:block; flex:1;}
.freq-option input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.freq-option span{display:block; text-align:center; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); border-radius:12px; padding:9px 4px; color:var(--ink-soft);}
.freq-option input:checked + span{border-color:var(--sage); background:#EAF0E4; color:var(--sage-dark);}
.dow-select{display:flex; gap:6px;}
.dow-option{position:relative; display:block; flex:1;}
.dow-option input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.dow-option span{display:block; text-align:center; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); border-radius:10px; padding:8px 0; color:var(--ink-soft);}
.dow-option input:checked + span{border-color:var(--gold); background:#FBF0D6; color:var(--gold-dark);}

/* サブタスク編集行(モーダル内) */
.subtask-edit-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
.subtask-edit-row .text-input{flex:1;}
.subtask-edit-row .icon-btn{color:var(--clay); flex-shrink:0;}

/* サブタスク表示(カード内) */
.subtask-list{margin-top:5px; display:flex; flex-direction:column; gap:3px;}
.subtask-row{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink);}
.subtask-row input{width:17px; height:17px; accent-color:var(--gold); flex-shrink:0;}
.subtask-row input:checked + span{text-decoration:line-through; color:var(--ink-soft);}

/* メモ */
.item-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
.item-title-row .item-title{margin:0; flex:1;}
.item-note-btn{display:inline-flex; align-items:center; gap:4px; max-width:100%; background:var(--paper-2); border:none; border-radius:999px; padding:4px 9px; font-size:10px; color:var(--ink-soft); margin-top:6px;}
.item-note-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-note-btn.has-note{color:var(--ink); font-style:italic; background:#EAE0C6;}

/* 保留ボックス */
.pending-banner{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:14px; font-size:13px; font-weight:700; color:var(--ink);}
.pending-banner .icon{color:var(--gold-dark); flex-shrink:0;}
.pending-banner span{flex:1;}
.pending-count-badge{flex:none !important; background:var(--paper-2); color:var(--ink-soft); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; font-family:var(--font-game);}
.pending-actions{display:flex; gap:8px; margin-top:10px;}
.pending-actions .btn-secondary,.pending-actions .btn-primary{flex:1;}
.muted-card{opacity:.55;}
.disabled-circle{width:34px;height:34px; border-radius:50%; border:2px dashed var(--line); flex-shrink:0; margin-top:5px;}

/* カレンダー */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-month-label{font-size:14.5px; font-weight:700;}
.cal-next-icon{transform:rotate(180deg);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:10px;}
.cal-dow{text-align:center; font-size:11px; color:var(--ink-soft); font-weight:700; padding:4px 0;}
.cal-cell{aspect-ratio:1; border:none; background:var(--paper); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative;}
.cal-cell.empty{background:none;}
.cal-cell.today{border:1.5px solid var(--gold);}
.cal-cell.selected{background:var(--olive);}
.cal-cell.selected .cal-day-num{color:#fff;}
.cal-day-num{font-size:12px; font-weight:700; color:var(--ink); font-family:var(--font-game);}
.cal-dot{width:6px; height:6px; border-radius:50%; background:#D8CBAE;}
.cal-dot.lv1{background:#B9CBA9;}
.cal-dot.lv2{background:var(--sage);}
.cal-dot.lv3{background:var(--olive);}
.cal-cell.selected .cal-dot{background:#fff;}
.cal-cell.event-end{box-shadow:inset 0 0 0 1.5px var(--gold);}
.cal-event-flag{position:absolute; top:3px; right:3px; width:6px; height:6px; border-radius:50%; background:var(--gold);}
.cal-event-flag.static{position:static; display:inline-block;}
.cal-legend{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-soft); margin-bottom:16px; flex-wrap:wrap;}
.cal-legend .cal-dot{width:8px;height:8px;}
.cal-legend-sep{width:1px; height:12px; background:var(--line); margin:0 4px;}

/* 月間レポート */
.report-stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
.report-stat{background:var(--paper); border-radius:var(--radius-md); padding:14px; text-align:center; box-shadow:var(--shadow);}
.report-stat-value{font-size:20px; font-weight:700; margin:0; display:flex; align-items:center; justify-content:center; gap:3px; font-family:var(--font-game);}
.report-stat-label{font-size:11px; color:var(--ink-soft); margin:4px 0 0;}
.report-diff{display:inline-block; font-size:9.5px; margin-top:4px; font-weight:700; padding:1px 7px; border-radius:8px; font-family:var(--font-game);}
.report-diff.up{color:var(--sage-dark); background:rgba(143,163,126,.16);}
.report-diff.down{color:var(--clay); background:rgba(193,105,79,.14);}
.report-diff.flat{color:var(--ink-soft); background:rgba(138,122,100,.12);}
.report-diff.new{color:var(--gold-dark); background:rgba(169,124,30,.14);}

.toast-root{position:fixed; bottom:80px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:100; pointer-events:none;}
.toast{background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; transform:translateY(10px); transition:all .3s ease; box-shadow:0 4px 14px rgba(0,0,0,0.2); max-width:88vw; text-align:center;}
.toast .icon{width:14px;height:14px;vertical-align:-2px;margin-right:3px;}

/* レベルアップ演出 */
.levelup-overlay{position:fixed; inset:0; background:rgba(70,55,35,0.55); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .3s ease; overflow:hidden;}
.levelup-overlay.show{opacity:1;}
.levelup-card{background:var(--cream); border-radius:28px; padding:32px 28px 28px; text-align:center; max-width:300px; width:88%; box-shadow:0 10px 40px rgba(0,0,0,0.25); transform:scale(.85); transition:transform .35s cubic-bezier(.34,1.56,.64,1); position:relative; z-index:2; overflow:hidden;}
.levelup-overlay.show .levelup-card{transform:scale(1);}
.levelup-mascot img{display:block; margin:16px auto 12px;}
.levelup-label{font-size:13px; font-weight:900; letter-spacing:3px; color:#fff; margin:-32px -28px 0; padding:9px 0; background:var(--poke-red); font-family:var(--font-game);}
.levelup-level{font-size:30px; font-weight:700; color:var(--ink); margin:4px 0 14px; font-family:var(--font-game);}
.levelup-sub{font-size:13px; color:var(--ink-soft); margin:0 0 22px; display:flex; align-items:center; justify-content:center; gap:5px;}
.levelup-card .btn-primary{width:100%;}
.confetti-layer{position:absolute; inset:0; overflow:hidden; z-index:1; pointer-events:none;}
.confetti-leaf{position:absolute; top:-30px; color:#8FA37E; opacity:0; animation-name:leafFall; animation-timing-function:ease-in; animation-iteration-count:1; animation-fill-mode:forwards;}
.confetti-leaf:nth-child(3n){color:#D2A23B;}
.confetti-leaf:nth-child(3n+1){color:#A6907E;}
@keyframes leafFall{
  0%{ transform:translateY(0) rotate(0deg); opacity:0; }
  8%{ opacity:.95; }
  100%{ transform:translateY(760px) rotate(var(--rot)); opacity:0.1; }
}
.toast.show{opacity:1; transform:translateY(0);}

/* ごほうび交換: 半券をちぎる演出 */
.tx-overlay{position:fixed; inset:0; z-index:210; background:rgba(60,46,28,.72); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px)); opacity:0; transition:opacity .3s ease; overflow:hidden; overscroll-behavior:contain; touch-action:none;}
.tx-overlay.show{opacity:1;}
.tx-pill{display:flex; align-items:center; gap:5px; background:var(--cream); border-radius:999px; padding:7px 16px; font-weight:700; font-size:16px; color:var(--olive); font-family:var(--font-game); box-shadow:0 4px 14px rgba(0,0,0,.25);}
.tx-pill .icon{width:18px; height:18px;}
.tx-ticket{--stub:96px; position:relative; display:flex; align-items:stretch; width:min(340px,88vw); height:168px; filter:drop-shadow(0 10px 22px rgba(0,0,0,.3)); transform:scale(.7) rotate(-4deg); opacity:0; transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .25s ease;}
.tx-overlay.show .tx-ticket{transform:none; opacity:1;}
.tx-main{position:relative; z-index:2; flex:1; min-width:0; padding:18px 20px; display:flex; flex-direction:column; justify-content:center; background:var(--paper); border-radius:18px 0 0 18px;}
.tx-label{font-size:11px; color:var(--ink-soft); margin:0 0 8px; letter-spacing:1px;}
.tx-title{font-size:22px; font-weight:700; margin:0 0 14px; line-height:1.3; word-break:break-word; color:var(--ink);}
.tx-title.md{font-size:18px; margin-bottom:12px;}
.tx-title.sm{font-size:15px; margin-bottom:10px;}
.tx-cost{font-size:13px; font-weight:700; color:var(--gold-dark); margin:0; display:flex; align-items:center; gap:4px;}
.tx-cost .icon{width:13px; height:13px;}
.tx-stub{position:relative; z-index:3; width:var(--stub); flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:6px; border-left:2px dashed var(--tan); background:var(--paper-2); border-radius:0 18px 18px 0; transform-origin:left center; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;}
.tx-stub:active{cursor:grabbing;}
.tx-stub-text{writing-mode:vertical-rl; font-size:13px; letter-spacing:.25em; color:var(--ink-soft);}
.tx-chev{width:20px; height:20px; color:var(--ink-soft); animation:txBounceDown 1.1s ease-in-out infinite;}
@keyframes txBounceDown{0%,100%{transform:translateY(-2px); opacity:.5;} 50%{transform:translateY(4px); opacity:1;}}
.tx-tear{position:absolute; left:-3px; top:-4px; width:10px; height:calc(100% + 8px); background:var(--paper-2); z-index:20; opacity:0; pointer-events:none; clip-path:polygon(20% 0%,70% 5%,25% 11%,80% 17%,30% 23%,75% 29%,15% 35%,70% 41%,25% 47%,85% 53%,20% 59%,75% 65%,30% 71%,80% 77%,20% 83%,70% 89%,25% 95%,75% 100%);}
.tx-ticket.is-hint .tx-stub{animation:txHintWiggle 2s ease-in-out infinite;}
@keyframes txHintWiggle{0%,55%,100%{transform:none;} 65%{transform:translate(2px,8px) rotate(.9deg);} 75%{transform:none;} 85%{transform:translate(1px,4px) rotate(.4deg);}}
.tx-scrap{position:absolute; left:calc(100% - var(--stub)); top:50%; width:6px; height:9px; background:var(--paper); opacity:0; pointer-events:none; z-index:50;}
.tx-scrap:nth-of-type(1){--x:42px; --y:-28px; --r:150deg;}
.tx-scrap:nth-of-type(2){--x:62px; --y:18px; --r:210deg;}
.tx-scrap:nth-of-type(3){--x:35px; --y:44px; --r:90deg;}
.tx-ticket.is-scraps .tx-scrap{animation:txScrapFly 520ms cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes txScrapFly{0%{opacity:0; transform:translate(0,0) rotate(0);} 20%{opacity:1;} 100%{opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r));}}
.tx-ticket.is-done .tx-main{animation:txMainPop .34s cubic-bezier(.2,.9,.3,1.3); clip-path:polygon(0 0,100% 0,97% 7%,100% 14%,96% 21%,100% 28%,97% 35%,100% 42%,96% 49%,100% 56%,97% 63%,100% 70%,96% 77%,100% 84%,97% 91%,100% 100%,0 100%);}
@keyframes txMainPop{0%{transform:scale(1);} 35%{transform:scale(1.045) translateY(-2px);} 100%{transform:scale(1);}}
.tx-stamp{position:absolute; right:10px; bottom:12px; opacity:0; font-family:var(--font-game); font-size:30px; line-height:1; letter-spacing:2px; color:var(--poke-red); border:3px solid var(--poke-red); border-radius:8px; padding:4px 9px 3px; transform:rotate(-10deg); pointer-events:none;}
.tx-ticket.is-stamp .tx-stamp{animation:txStampIn .4s cubic-bezier(.2,.9,.3,1.25) forwards;}
@keyframes txStampIn{0%{opacity:0; transform:scale(2.6) rotate(-24deg);} 55%{opacity:.95; transform:scale(.94) rotate(-9deg);} 100%{opacity:.92; transform:scale(1) rotate(-10deg);}}
.tx-bottom{display:grid; width:min(300px,88vw); justify-items:center; min-height:100px;}
.tx-bottom > *{grid-area:1 / 1;}
.tx-hinttext{display:flex; flex-direction:column; align-items:center; gap:10px; transition:opacity .25s ease;}
.tx-hinttext.hide{opacity:0; pointer-events:none; visibility:hidden; transition:opacity .25s ease, visibility 0s linear .25s;}
.tx-hinttext p{margin:0; color:#fff; font-size:14px; font-weight:700; text-align:center; line-height:1.6;}
.tx-cancel{color:rgba(255,255,255,.75); font-size:13px; padding:8px 16px; text-decoration:underline; text-underline-offset:3px; text-align:center;}
.tx-after{width:100%; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; opacity:0; transform:translateY(8px); pointer-events:none; visibility:hidden; transition:opacity .3s ease, transform .3s ease, visibility 0s linear .3s;}
.tx-after.show{opacity:1; transform:none; pointer-events:auto; visibility:visible; transition-delay:0s;}
.tx-msg{margin:0; color:#fff; font-size:13.5px; font-weight:700; text-align:center; line-height:1.6;}
.tx-after .btn-primary{width:100%;}
.tx-coin{position:fixed; left:-8px; top:-8px; width:16px; height:16px; border-radius:50%; background:var(--gold); border:2px solid var(--gold-dark); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); z-index:260; pointer-events:none;}
.tx-cf{position:fixed; left:-7px; top:-7px; width:14px; height:14px; z-index:260; pointer-events:none;}
.tx-cf.coin{border-radius:50%; background:#D2A23B; box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
.tx-cf.star{background:#E8B23D; clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.tx-cf.leaf{background:#8FA37E; border-radius:0 100% 0 100%;}

/* サプライズボール: 待機中の揺れ + 開封演出 */
.mystery-card.has-box .mystery-head .icon{transform-origin:50% 88%; animation:sbCardWiggle 3.8s ease-in-out infinite;}
@keyframes sbCardWiggle{0%,62%,100%{transform:rotate(0);} 67%{transform:rotate(-16deg);} 73%{transform:rotate(14deg);} 79%{transform:rotate(-10deg);} 85%{transform:rotate(6deg);} 91%{transform:rotate(-2deg);}}
.mystery-card.has-box .btn-primary:not(:disabled){animation:sbBtnRing 3.8s ease-out infinite;}
@keyframes sbBtnRing{0%,64%{box-shadow:0 0 0 0 rgba(210,162,59,.55);} 92%,100%{box-shadow:0 0 0 12px rgba(210,162,59,0);}}

.sb-overlay{position:fixed; inset:0; z-index:210; background:rgba(50,38,22,.78); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px)); opacity:0; transition:opacity .3s ease; overflow:hidden; overscroll-behavior:contain; touch-action:none;}
.sb-overlay.show{opacity:1;}
.sb-inner{display:flex; flex-direction:column; align-items:center; gap:18px;}
.sb-inner.shake1{animation:sbShake1 .32s linear;}
.sb-inner.shake2{animation:sbShake2 .55s linear;}
@keyframes sbShake1{0%,100%{transform:translate(0,0);} 15%{transform:translate(-4px,2px);} 30%{transform:translate(4px,-3px);} 45%{transform:translate(-3px,-2px);} 60%{transform:translate(3px,3px);} 75%{transform:translate(-2px,1px);}}
@keyframes sbShake2{0%,100%{transform:translate(0,0);} 10%{transform:translate(-9px,4px);} 20%{transform:translate(8px,-6px);} 30%{transform:translate(-7px,-4px);} 42%{transform:translate(7px,6px);} 55%{transform:translate(-5px,3px);} 70%{transform:translate(4px,-3px);} 85%{transform:translate(-2px,1px);}}
.sb-stage{position:relative; width:200px; height:200px; display:grid; place-items:center;}
.sb-rays{position:absolute; width:440px; height:440px; left:50%; top:50%; margin:-220px 0 0 -220px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(255,214,102,.55) 0 7deg, rgba(255,214,102,0) 7deg 18deg); -webkit-mask-image:radial-gradient(circle, #000 18%, transparent 68%); mask-image:radial-gradient(circle, #000 18%, transparent 68%); opacity:0; transition:opacity .5s ease; pointer-events:none;}
.sb-rays.on{opacity:1; animation:sbRaySpin 9s linear infinite;}
.sb-rays.big{width:560px; height:560px; margin:-280px 0 0 -280px; animation-duration:6s;}
@keyframes sbRaySpin{to{transform:rotate(360deg);}}
.sb-glow{position:absolute; width:260px; height:260px; left:50%; top:50%; margin:-130px 0 0 -130px; border-radius:50%; background:radial-gradient(circle, rgba(255,214,102,.9) 0%, rgba(255,214,102,0) 65%); opacity:.22; transform:scale(.8); pointer-events:none;}
.sb-ring{position:absolute; left:0; top:0; width:200px; height:200px; pointer-events:none;}
.sb-ring-bg{fill:none; stroke:rgba(255,255,255,.16); stroke-width:6;}
.sb-ring-fg{fill:none; stroke:#F2C14E; stroke-width:6; stroke-linecap:round; stroke-dasharray:565.5; stroke-dashoffset:565.5;}
.sb-ring.full .sb-ring-fg{stroke:#fff; filter:drop-shadow(0 0 6px #ffd66b); animation:sbRingPulse .45s ease-in-out infinite alternate;}
@keyframes sbRingPulse{from{stroke-width:6;} to{stroke-width:11;}}
.sb-ballwrap{position:relative; z-index:3; width:132px; height:132px; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:grab;}
.sb-ballwrap:active{cursor:grabbing;}
.sb-ballwrap.idle{animation:sbBob 2.4s ease-in-out infinite;}
@keyframes sbBob{0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);}}
.sb-ball{width:100%; height:100%; display:block; overflow:visible; filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));}
.sb-half,.sb-clasp{transform-box:fill-box; transform-origin:center; transition:transform .55s cubic-bezier(.2,.7,.3,1), opacity .45s ease .08s;}
.sb-ballwrap.is-split .sb-top{transform:translate(-30px,-52px) rotate(-30deg); opacity:0;}
.sb-ballwrap.is-split .sb-bot{transform:translate(24px,46px) rotate(18deg); opacity:0;}
.sb-ballwrap.is-split .sb-clasp{transform:scale(2.4); opacity:0;}
.sb-ballwrap.is-white .sb-ball{filter:brightness(1.7) saturate(.6) drop-shadow(0 0 18px rgba(255,255,255,.9));}
.sb-cardwrap{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; pointer-events:none;}
.sb-card{position:relative; width:min(300px,84vw); padding:22px 18px 18px; text-align:center; background:var(--paper); border:3px solid var(--tan); border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); transform:scale(0); opacity:0;}
.sb-card.in{animation:sbCardIn .55s cubic-bezier(.2,.9,.3,1.25) forwards;}
@keyframes sbCardIn{0%{transform:scale(.15) rotate(-6deg); opacity:0;} 60%{opacity:1;} 100%{transform:scale(1) rotate(0); opacity:1;}}
.sb-card.t3{border-color:var(--gold); box-shadow:0 0 0 3px rgba(210,162,59,.25), 0 10px 30px rgba(0,0,0,.35);}

<script>
/* ===== 定数 ===== */
const STORAGE_KEY = 'tanukihonpo_v1';
const DIFFICULTIES = [
  {key:'easy', label:'かんたん', leaves:20},
  {key:'normal', label:'ふつう', leaves:30},
  {key:'hard', label:'むずかしい', leaves:50},
  {key:'extreme', label:'激ムズ', leaves:100},
];
const DIFF_MAP = Object.fromEntries(DIFFICULTIES.map(d=>[d.key,d]));
const TAG_COLORS = ['sage','gold','olive','taupe','clay','plum','teal','rose','amber','slate'];
const SLEEP_PRE_ACTION_DEFAULTS = ['入浴','スマホ','読書','ストレッチ','飲酒','カフェイン'];
const COND_TAG_DEFAULTS = ['生理','腹痛','頭痛','風邪','だるい','寝不足'];
const COND_ITEMS = [
  {key:'sat',   label:'満足度', color:'#D2A23B', shape:'star'},
  {key:'cond',  label:'体調',   color:'#C1694F', shape:'circle'},
  {key:'mind',  label:'心',     color:'#D07A92', shape:'heart'},
  {key:'sleep', label:'睡眠',   color:'#5E6C9E', shape:'diamond'},
  {key:'focus', label:'集中',   color:'#8FA37E', shape:'bar'}
];
const COND_SHAPE_D = {
  circle:'M12 2.6a9.4 9.4 0 1 0 0 18.8a9.4 9.4 0 1 0 0-18.8z',
  star:'M12.00 0.70 L15.29 8.67 L23.89 9.34 L17.33 14.93 L19.35 23.31 L12.00 18.80 L4.65 23.31 L6.67 14.93 L0.11 9.34 L8.71 8.67 Z',
  heart:'M12 21.6C5 15.6 2 12 2 8.3C2 5.3 4.3 3.1 7.1 3.1C9.2 3.1 11 4.2 12 5.9C13 4.2 14.8 3.1 16.9 3.1C19.7 3.1 22 5.3 22 8.3C22 12 19 15.6 12 21.6Z',
  diamond:'M12 1.2L20.8 12L12 22.8L3.2 12Z',
  bar:'M7 5h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z'
};

/* ===== ステータス振り ===== */
const STAT_DEFS = [
  {key:'atk', label:'こうげき', icon:'i-sword', color:'clay'},
  {key:'def', label:'ぼうぎょ', icon:'i-shield', color:'slate'},
  {key:'spatk', label:'とくこう', icon:'i-spark', color:'plum'},
  {key:'spdef', label:'とくぼう', icon:'i-gem', color:'teal'},
  {key:'spd', label:'すばやさ', icon:'i-wind', color:'gold'},
];
const HP_STAT_DEF = {key:'hp', label:'HP', icon:'i-heart', color:'rose'};
const STAT_CAP = 200;
const HP_CAP = 300;
const STAT_GROWTH_K = 0.00045; // 上限へ近づくほど緩やかになる調整係数。数値を見ながら後で調整可
function statValueFromExp(sumExp, cap){
  sumExp = Math.max(0, sumExp||0);
  if(sumExp<=0) return 0;
  const ratio = 1 - 1/(1 + STAT_GROWTH_K*sumExp);
  return Math.round(cap*ratio);
}
function computeStats(){
  const sums = {atk:0, def:0, spatk:0, spdef:0, spd:0};
  let hpSum = 0;
  state.tags.forEach(t=>{
    hpSum += (t.exp||0);
    if(t.statKey && sums.hasOwnProperty(t.statKey)) sums[t.statKey] += (t.exp||0);
  });
  const values = {};
  STAT_DEFS.forEach(sd=>{ values[sd.key] = statValueFromExp(sums[sd.key], STAT_CAP); });
  values.hp = statValueFromExp(hpSum, HP_CAP);
  return values;
}
function statDefByKey(key){ return key==='hp'? HP_STAT_DEF : STAT_DEFS.find(s=>s.key===key); }

/* ===== バッジ ===== */
const BADGE_TIERS = [
  {key:'bronze', label:'銅', level:10},
  {key:'silver', label:'銀', level:15},
  {key:'gold', label:'金', level:20},
  {key:'platinum', label:'プラチナ', level:25},
];
const STREAK_BADGE_MILESTONES = [7,30,100,365];
const COMPLETION_BADGE_MILESTONES = [50,150,300,500];
const FOCUS_BADGE_HOUR_MILESTONES = [50,150,200,350];
function getAllBadges(){
  const list = [];
  state.tags.forEach(t=>{
    const lv = tagLevelInfo(t.exp).level;
    BADGE_TIERS.forEach(tier=>{
      const unlocked = lv>=tier.level;
      list.push({
        icon:'i-badge', colorClass:(t.color||'sage'), tierClass:'tier-'+tier.key,
        name:t.name+'・'+tier.label,
        status: unlocked? 'Lv.'+tier.level+' 獲得済み' : 'Lv.'+tier.level+'で解放(Lv.'+lv+')',
        unlocked
      });
    });
  });
  STREAK_BADGE_MILESTONES.forEach(m=>{
    const longest = state.streak.longest||0;
    const unlocked = longest>=m;
    list.push({icon:'i-flame', colorClass:'clay', tierClass:'',
      name:m+'日連続',
      status: unlocked? '獲得済み(最長'+longest+'日)' : m+'日連続で解放(最長'+longest+'日)',
      unlocked});
  });
  COMPLETION_BADGE_MILESTONES.forEach(m=>{
    const cur = state.lifetimeCompletions||0;
    const unlocked = cur>=m;
    list.push({icon:'i-star', colorClass:'teal', tierClass:'',
      name:m+'件達成',
      status: unlocked? '獲得済み' : m+'件達成で解放(現在'+cur+'件)',
      unlocked});
  });
  FOCUS_BADGE_HOUR_MILESTONES.forEach(h=>{
    const curH = Math.floor((state.lifetimeFocusMinutes||0)/60);
    const unlocked = curH>=h;
    list.push({icon:'i-clock', colorClass:'slate', tierClass:'',
      name:h+'時間集中',
      status: unlocked? '獲得済み' : h+'時間で解放(現在'+curH+'時間)',
      unlocked});
  });
  return list;
}
function checkNewBadges(category, before, after){
  let milestones, label, icon;
  if(category==='streak'){ milestones=STREAK_BADGE_MILESTONES; label='日連続'; icon='i-flame'; }
  else if(category==='completion'){ milestones=COMPLETION_BADGE_MILESTONES; label='件達成'; icon='i-star'; }
  else if(category==='focus'){ milestones=FOCUS_BADGE_HOUR_MILESTONES; label='時間集中'; icon='i-clock'; }
  else return;
  milestones.forEach(m=>{
    if(before<m && after>=m){
      queueToast('<svg class="icon"><use href="#'+icon+'"/></svg>「'+m+label+'」バッジ獲得!');
      state.badgeHistory.unshift({id:uid(), tagId:null, tagName:m+label, date:todayStr(), time:new Date().toISOString()});
    }
  });
}

/* ===== ユーティリティ ===== */
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = (d) => { if(d===undefined) d = new Date(Date.now() - 3*60*60*1000); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; };
const dateObj = (s) => new Date(s+'T00:00:00');
const addDays = (dateStr, n) => { const d = dateObj(dateStr); d.setDate(d.getDate()+n); return todayStr(d); };
const daysBetween = (a,b) => Math.round((dateObj(b)-dateObj(a))/86400000);
const fmtDate = (s) => { if(!s) return ''; const p=s.split('-'); return p[0]+'/'+p[1]+'/'+p[2]; };
const clampNum = (n,min,max)=>Math.max(min,Math.min(max,n));
const escapeHtml = (str) => String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function levelInfo(exp, base, growth){
  base = base || 300; growth = growth || 1.18;
  let level=1, need=base, remain=Math.max(0,exp);
  while(remain>=need){ remain-=need; level++; need=Math.round(need*growth); }
  return {level, cur:remain, need};
}
function tagLevelInfo(exp){ return levelInfo(exp, 110, 1.15); }

function normalizeState(s, rawParsed){
  s.dailies.forEach(d=>{
    if(!d.schedule) d.schedule = {type:'daily', days:[]};
    if(!d.notes) d.notes = {};
    if(!d.dismissedDates) d.dismissedDates = [];
    if(!d.completedTimes) d.completedTimes = {};
  });
  s.achievements.forEach(a=>{
    if(!a.mode) a.mode = 'simple';
    if(!a.subtasks) a.subtasks = [];
    if(typeof a.note !== 'string') a.note = '';
    if(typeof a.rewardedLeaves !== 'number') a.rewardedLeaves = a.completed ? (DIFF_MAP[a.difficulty]? DIFF_MAP[a.difficulty].leaves : 0) : 0;
    if(!Array.isArray(a.progressLog)) a.progressLog = [];
    if(!('dueDate' in a)) a.dueDate = null;
  });
  s.tags.forEach(t=>{
    if(typeof t.statKey === 'undefined') t.statKey = null;
  });
  if(!s.goodThings) s.goodThings = {};
  if(!s.funThings) s.funThings = {};
  if(!s.reflectionNotes) s.reflectionNotes = [];
  if(!Array.isArray(s.reflectionNotes)){
    // 旧仕様(日付ごとに1件のオブジェクト形式)から、複数投稿できる配列形式へ移行
    const migrated = [];
    Object.keys(s.reflectionNotes).forEach(date=>{
      if(s.reflectionNotes[date]) migrated.push({id:uid(), date, time:null, text:s.reflectionNotes[date]});
    });
    s.reflectionNotes = migrated;
  }
  if(!s.badgeHistory) s.badgeHistory = [];
  if(!s.mysteryPool) s.mysteryPool = [];
  s.mysteryPool.forEach(p=>{ if(!p.stars) p.stars = 3; });
  if(!s.mysteryHistory) s.mysteryHistory = [];
  s.mysteryHistory.forEach(m=>{ if(typeof m.done !== 'boolean') m.done = false; });
  if(!s.purchaseHistory) s.purchaseHistory = [];
  s.purchaseHistory.forEach(p=>{ if(typeof p.done !== 'boolean') p.done = false; });
  {
    const doneEntries = s.purchaseHistory.filter(p=>p.done).sort((a,b)=>(b.time||b.date).localeCompare(a.time||a.date));
    if(doneEntries.length>15){
      const keepIds = new Set(doneEntries.slice(0,15).map(p=>p.id));
      s.purchaseHistory = s.purchaseHistory.filter(p=> !p.done || keepIds.has(p.id));
    }
  }
  if(!s.favoriteCategories) s.favoriteCategories = [];
  if(!s.favoriteItems) s.favoriteItems = [];
  s.favoriteItems.forEach((f,i)=>{
    if(typeof f.order !== 'number') f.order = i;
    if(typeof f.starred !== 'boolean') f.starred = false;
  });
  if(!rawParsed || typeof rawParsed.lifetimeCompletions !== 'number'){
    // 既存データからの移行: これまでの完了実績を初期値として積算しておく(defaultStateとのマージでは判定できないため、マージ前の生データを見る)
    const dailyDone = s.dailies.reduce((sum,d)=>sum+(d.completedDates?d.completedDates.length:0), 0);
    const achDone = s.achievements.filter(a=>a.completed).length;
    s.lifetimeCompletions = dailyDone + achDone;
  }
  if(!rawParsed || typeof rawParsed.lifetimeFocusMinutes !== 'number'){
    s.lifetimeFocusMinutes = (s.focusSessions||[]).reduce((sum,f)=>sum+(f.minutes||0), 0);
  }
  if(!s.pendingDailies) s.pendingDailies = [];
  if(!s.lastRolloverDate) s.lastRolloverDate = todayStr();
  if(!s.focusSessions) s.focusSessions = [];
  s.focusSessions.forEach(f=>{
    if(typeof f.companion!=='string') f.companion='';
    if(typeof f.condition!=='number') f.condition=null;
    if(typeof f.mood!=='number') f.mood=null;
    if(typeof f.concentration!=='number') f.concentration=null;
    if(typeof f.startTime!=='string') f.startTime=null;
    if(typeof f.endTime!=='string') f.endTime=null;
  });
  if(!s.dayRatings) s.dayRatings = {};
  if(!s.dayLogs || typeof s.dayLogs!=='object' || Array.isArray(s.dayLogs)) s.dayLogs = {};
  Object.keys(s.dayLogs).forEach(k=>{
    const l = s.dayLogs[k];
    if(!l || typeof l!=='object' || !/^\d{4}-\d{2}-\d{2}$/.test(k)){ delete s.dayLogs[k]; return; }
    const lv = v=> (typeof v==='number' && v>=1 && v<=5) ? Math.round(v) : null;
    l.condition = lv(l.condition);
    l.mind = lv(l.mind);
    if(typeof l.diary!=='string') l.diary = '';
    if(typeof l.condNote!=='string') l.condNote = '';
    l.condTags = Array.isArray(l.condTags) ? l.condTags.filter(x=>typeof x==='string' && x) : [];
  });
  if(!Array.isArray(s.condTagOptions)) s.condTagOptions = COND_TAG_DEFAULTS.slice();
  s.condTagOptions = Array.from(new Set(s.condTagOptions.filter(a=>typeof a==='string' && a.trim()).map(a=>a.trim())));
  if(!s.condChartShow || typeof s.condChartShow!=='object' || Array.isArray(s.condChartShow)) s.condChartShow = {};
  ['sat','cond','mind','sleep','focus'].forEach(k=>{ if(typeof s.condChartShow[k]!=='boolean') s.condChartShow[k] = true; });
  if(!s.sleepLogs || typeof s.sleepLogs!=='object' || Array.isArray(s.sleepLogs)) s.sleepLogs = {};
  Object.keys(s.sleepLogs).forEach(k=>{
    const l = s.sleepLogs[k];
    if(!l || typeof l!=='object'){ delete s.sleepLogs[k]; return; }
    const okT = t=> typeof t==='string' && /^([01]?\d|2[0-3]):[0-5]\d$/.test(t);
    const fixT = t=> t.split(':')[0].padStart(2,'0')+':'+t.split(':')[1];
    if(!okT(l.bedTime)) l.bedTime = null; else l.bedTime = fixT(l.bedTime);
    if(!okT(l.onsetTime) || !okT(l.wakeTime)){ delete s.sleepLogs[k]; return; }
    l.onsetTime = fixT(l.onsetTime); l.wakeTime = fixT(l.wakeTime);
    if(typeof l.quality!=='number') l.quality = null;
    if(typeof l.wakeQuality!=='number') l.wakeQuality = null;
    if(typeof l.comment!=='string') l.comment = '';
    l.preActions = Array.isArray(l.preActions) ? l.preActions.filter(x=>typeof x==='string' && x) : [];
  });
  if(!Array.isArray(s.sleepPreActionOptions)) s.sleepPreActionOptions = SLEEP_PRE_ACTION_DEFAULTS.slice();
  if(!rawParsed || !Array.isArray(rawParsed.sleepPreActionOptions)){
    // 初回移行: 既定の候補 + これまでの記録で使った行動
    const cnt = {};
    Object.keys(s.sleepLogs).forEach(k=>{ s.sleepLogs[k].preActions.forEach(a=>{ cnt[a] = (cnt[a]||0)+1; }); });
    const custom = Object.keys(cnt).filter(a=>!SLEEP_PRE_ACTION_DEFAULTS.includes(a)).sort((x,y)=>cnt[y]-cnt[x]);
    s.sleepPreActionOptions = SLEEP_PRE_ACTION_DEFAULTS.concat(custom);
  }
  s.sleepPreActionOptions = Array.from(new Set(s.sleepPreActionOptions.filter(a=>typeof a==='string' && a.trim()).map(a=>a.trim())));
  if(!s.weeklyFocusGoalMinutes) s.weeklyFocusGoalMinutes = 70*60;
  if(typeof s.lastSeenFocusWeekStart !== 'string') s.lastSeenFocusWeekStart = startOfFocusWeek(todayStr());

    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if(!done){ apply(1); complete(); } }

function pickMysteryItem(){
  const pool = state.mysteryPool;
  const weight = p => 6 - clampNum(p.stars||3,1,5); // ★が多いほど出にくい(★1=重み5 〜 ★5=重み1)
  const total = pool.reduce((sum,p)=>sum+weight(p),0);
  if(total<=0) return pool[Math.floor(Math.random()*pool.length)];
  let r = Math.random()*total;
  for(const p of pool){ r -= weight(p); if(r<=0) return p; }
  return pool[pool.length-1];
}

function monthMeta(monthStr){

      items.push({icon:'i-edit', label:'ひとこと日記', title:dlog.diary.trim(), time:null, order:8.3, editable:'daylog', id:dateStr});

    items.push({icon:'i-edit', label:'ひとことメモ', title:n.text, time:n.time, order:9, editable:'streaknote', id:n.id});

function minutesToHM(n){
  n = ((Math.round(n)%1440)+1440)%1440;
  return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
}
function sleepDurationMin(onset, wake){
  if(!onset || !wake) return null;
  return (timeToMinutes(wake) - timeToMinutes(onset) + 1440) % 1440;
}
function sleepInBedMin(bed, wake){
  if(!bed || !wake) return null;
  return (timeToMinutes(wake) - timeToMinutes(bed) + 1440) % 1440;
}
function sleepTimesError(bed, onset, wake){
  if(!onset || !wake) return '入眠と起床の時刻を入力してください';
  if(timeToMinutes(onset)===timeToMinutes(wake)) return '入眠と起床が同じ時刻になっています';
  if(bed){
    if(sleepInBedMin(bed, wake) < sleepDurationMin(onset, wake)) return '就寝→入眠→起床の順になっているか確認してください';
  }
  return '';
}

function focusRankInfo(pct){

function rankRingSvg(filledCount){
  const size = 68, r = 30, cx = size/2, cy = size/2;
  const circumference = 2*Math.PI*r;
  const unit = circumference/5;
  const gap = unit*0.16;
  const seg = unit-gap;
  const bgDash = (seg.toFixed(2)+' '+gap.toFixed(2)+' ').repeat(5).trim();
  const parts = [];
  for(let i=0;i<5;i++){
    if(i<filledCount) parts.push(seg.toFixed(2), gap.toFixed(2));
    else parts.push('0', unit.toFixed(2));
  }
  return '<svg class="rank-ring-svg" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="'+bgDash+'" stroke-linecap="round"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="4" stroke-dasharray="'+parts.join(' ')+'" stroke-linecap="round"/>'+
  '</svg>';

function fmtHoursMin(minutes){
  const h = Math.floor(minutes/60), m = minutes%60;
  if(h<=0) return m+'分';
  if(m===0) return h+'時間';
  return h+'時間'+m+'分';
}
function dayActivityLevel(dateStr){
  const info = dayCompletionInfo(dateStr);
  const focusMin = focusMinutesOnDate(dateStr);
  const score = info.count + Math.floor(focusMin/30);
  if(score<=0) return 0;
  if(score<=2) return 1;
  if(score<=4) return 2;
  return 3;
}
function startOfWeek(dateStr){
  const d = dateObj(dateStr);
  return addDays(dateStr, -d.getDay());
}
function startOfFocusWeek(dateStr){
  // 月曜始まりの週の開始日(月曜日)を返す。集中時間・ランクの週区切りに使用(既存のstartOfWeekは日曜始まりのまま他機能で使うため触らない)
  const dow = dateObj(dateStr).getDay(); // 0=日,1=月,...6=土
  const diff = (dow===0) ? 6 : dow-1; // 直近の月曜日からの経過日数
  return addDays(dateStr, -diff);
}
function fmtMD(dateStr){
  const p = dateStr.split('-');

}
function shiftWeek(weekStartStr, deltaWeeks){
  return addDays(weekStartStr, deltaWeeks*7);
}
function computeWeeklyReport(weekStartStr){
  const today = todayStr();
  const weekEnd = addDays(weekStartStr, 6);
  let dueCount=0, doneCount=0, leavesEarned=0, achCount=0, focusMinutesTotal=0, dayCount=0;
  const tagCounts = {};
  state.tags.forEach(t=> tagCounts[t.id]=0);
  for(let i=0;i<7;i++){
    const dateStr = addDays(weekStartStr, i);
    if(dateStr>today) continue;
    dayCount++;
    focusMinutesTotal += focusMinutesOnDate(dateStr);
    state.dailies.forEach(d=>{
      if(isDueOn(d,dateStr)){
        dueCount++;
        if(d.completedDates.includes(dateStr)){
          doneCount++;
          leavesEarned += DIFF_MAP[d.difficulty].leaves;
          d.tagIds.forEach(tid=>{ if(tagCounts[tid]!==undefined) tagCounts[tid]++; });
        }
      }
    });
  }
  state.achievements.forEach(a=>{
    if(a.completedAt && a.completedAt>=weekStartStr && a.completedAt<=weekEnd){
      achCount++;
      leavesEarned += DIFF_MAP[a.difficulty].leaves;
      a.tagIds.forEach(tid=>{ if(tagCounts[tid]!==undefined) tagCounts[tid]++; });
    }
  });
  const levelUps = state.levelHistory.filter(h=> h.date>=weekStartStr && h.date<=weekEnd).length;
  const rate = dueCount>0? Math.round(doneCount/dueCount*100) : 0;
  const avgFocusPerDay = dayCount>0? Math.round(focusMinutesTotal/dayCount) : 0;
  return {dueCount, doneCount, rate, leavesEarned, achCount, levelUps, tagCounts, focusMinutesTotal, avgFocusPerDay};
}
function computeFocusWeekSummary(weekStartStr){
  const report = computeWeeklyReport(weekStartStr);
  const goalMinutes = state.weeklyFocusGoalMinutes;
  const pct = goalMinutes>0 ? Math.round(report.focusMinutesTotal/goalMinutes*100) : 0;
  const rank = focusRankInfo(pct);
  return {
    weekStart: weekStartStr,
    weekEnd: addDays(weekStartStr,6),
    focusMinutes: report.focusMinutesTotal,
    goalMinutes,
    pct, rank,
    achieved: report.focusMinutesTotal>=goalMinutes,
    doneCount: report.doneCount + report.achCount,
    levelUps: report.levelUps,
  };
}

function streakAtRiskNotice(){
  // 中1日休んだ状態(猶予期間の最終日)で、今日何もしないと明日途切れてしまうケースを検知する
  const st = state.streak;

}

function computeMonthlyReport(monthStr){

          d.tagIds.forEach(tid=>{ if(tagCounts[tid]!==undefined) tagCounts[tid]++; });

      leavesEarned += DIFF_MAP[a.difficulty].leaves;

function renderLineChart(days, opts){
  opts = opts || {};
  const gradId = opts.gradId || 'chartFade';

  const max = Math.max(opts.minMax||1, ...days.map(d=>d.count));
  const W=300, H=104, padX=18, padTop=16, padBottom=26;
  const plotH = H - padTop - padBottom;
  const stepX = (W - padX*2) / (days.length-1);
  const pts = days.map((d,i)=>({ x: padX + i*stepX, y: padTop + plotH - (d.count/max)*plotH, d }));
  const line = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area = line+' L'+pts[pts.length-1].x.toFixed(1)+','+(padTop+plotH).toFixed(1)+' L'+pts[0].x.toFixed(1)+','+(padTop+plotH).toFixed(1)+' Z';
  const todayD = todayStr();
  const dots = pts.map((p,i)=>{
    const isToday = p.d.date===todayD;
    const label = valueFmt(p.d.count);
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isToday?4:3)+'" fill="'+(isToday?'#D2A23B':'#5F7350')+'"/>'+
      (label? '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-8).toFixed(1)+'" font-size="9" text-anchor="middle" fill="#8A7A64">'+label+'</text>':'');
  }).join('');

  }).join('');

    '<defs><linearGradient id="'+gradId+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8FA37E" stop-opacity="0.35"/><stop offset="100%" stop-color="#8FA37E" stop-opacity="0"/></linearGradient></defs>'+

    dots + labels +
